<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Impede o "tema escuro automático" de navegadores de celular de recolorir o jogo (ícones sumiam, pergaminho ficava escuro). O jogo já tem as próprias cores, com contraste WCAG conferido. -->
<meta name="color-scheme" content="only light">
<title>Dungeon do Python II</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8'%3E%3Cpath fill='%23e8212b' d='M1 1h2v1h1v1h1V2h1V1h2v3H7v1H6v1H5v1H4V6H3V5H2V4H1z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0f0d0b; --bg2: #1a1612; --card: #17130f; --line: #4a3f31; --txt: #ebe2cf; --muted: #a3967e;
  --acc: #d4a849; --acc2: #7fb3b0; --ok: #7fbf6a; --bad: #e0565b; --code-bg: #0b0a09; --sangue: #9b1c1c; --osso: #cbbd9e;
  --perg: #e9dec4; --perg2: #d6c49c; --tinta: #2a2118;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Noto Sans", sans-serif;
  --head: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Consolas, "Courier New", monospace;
  --ind: 30px; --radius: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 16px; line-height: 1.45;
  min-height: 100vh; transition: background .4s;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
input, select, textarea { font: inherit; }
a { color: var(--acc2); }
#app { max-width: 1240px; margin: 0 auto; padding: 0 16px 90px; }
h1, h2, h3 { font-family: var(--head); margin: .3em 0; line-height: 1.15; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; }
.btn {
  background: var(--bg2); color: var(--txt); border: 2px solid var(--line); border-radius: 8px; padding: 9px 14px;
  font-weight: 600; transition: transform .08s, border-color .2s; touch-action: manipulation;
}
.btn:hover:not(:disabled) { border-color: var(--acc); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.pri { background: var(--acc); color: #1b1300; border-color: var(--acc); }
.btn.grande { font-size: 1.15em; padding: 13px 22px; }
.btn.perigo { border-color: var(--bad); color: var(--bad); }
.btn.mini { padding: 4px 9px; font-size: .85em; }
.cta { animation: pulso 1.6s infinite; }
@keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(240,180,41,.55); } 50% { box-shadow: 0 0 0 8px rgba(240,180,41,0); } }
.campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.campo input, .campo select, textarea {
  background: var(--code-bg); color: var(--txt); border: 2px solid var(--line); border-radius: 8px; padding: 10px;
}
footer#rodape {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 6px 14px; font-size: .78em; color: var(--muted); background: rgba(0,0,0,.35); backdrop-filter: blur(4px); z-index: 20;
}
footer#rodape button { background: none; border: none; color: var(--muted); padding: 4px 8px; }

/* ---------- topo do desafio ---------- */
.hud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 0 12px; }
.hud .titulo-andar { font-family: var(--head); font-weight: 700; font-size: 1.05em; }
.coracoes { display: flex; gap: 4px; }
.coracao { width: 30px; height: 27px; image-rendering: pixelated; }
.coracao.quebrou { animation: quebra .6s; }
@keyframes quebra { 0% { transform: scale(1.4) rotate(-10deg); } 40% { transform: scale(.7) rotate(10deg); } 100% { transform: none; } }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--line); font-size: .85em; }

/* ---------- área de desafio ---------- */
.enunciado { margin-bottom: 12px; }
.enunciado .historia { font-style: italic; color: var(--muted); margin: 0 0 6px; }
.enunciado .tarefa { font-weight: 600; margin: 0; }
.bancada { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.bancada > div { min-width: 0; }
@media (min-width: 900px) { .bancada { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } .bancada .col-prog { order: 2; } .bancada .col-pecas { order: 1; } }
.painel-titulo { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 6px; font-family: var(--head); }
.pool, .area {
  background: var(--code-bg); border: 2px dashed var(--line); border-radius: var(--radius); padding: 10px; min-height: 120px;
  display: flex; flex-direction: column; gap: 6px; position: relative;
}
.area { border-style: solid; padding-left: 10px; padding-top: 28px;
  background-image:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.18) 0 4px, transparent 4px 9px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,.18) 0 4px, transparent 4px 9px);
  background-size: 2px 100%, 2px 100%;
  background-position: calc(10px + var(--ind) - 6px) 0, calc(10px + 2 * var(--ind) - 6px) 0;
  background-repeat: no-repeat;
}
.trilhos { position: absolute; top: 6px; left: 10px; right: 10px; display: flex; font-size: .7em; color: var(--muted); font-family: var(--mono); pointer-events: none; }
.trilhos span { width: var(--ind); white-space: nowrap; }
.vazio { color: var(--muted); font-size: .9em; text-align: center; padding: 18px 6px; pointer-events: none; }
.bloco {
  min-width: 0; display: flex; align-items: stretch; gap: 0; background: #1d2433; border: 2px solid #34405a; border-radius: 7px;
  font-family: var(--mono); font-size: .92em; color: #e8eefc; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: margin-left .15s, box-shadow .15s; min-height: 38px;
}
.bloco .alca { display: flex; align-items: center; padding: 0 8px; color: #8796b8; cursor: grab; touch-action: none; border-right: 1px solid #34405a; font-size: 1.1em; }
.bloco .cod { padding: 8px 10px; white-space: pre; overflow-x: auto; flex: 1; cursor: pointer; align-self: center; }
.pool .bloco:hover { border-color: var(--acc); }
.bloco .ctrl { display: flex; align-items: center; gap: 2px; padding: 0 4px; border-left: 1px solid #34405a; }
.bloco .ctrl button { background: none; border: none; color: #c5d0ea; padding: 6px 7px; font-size: .95em; border-radius: 5px; min-width: 30px; }
.bloco .ctrl button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
.bloco.arrastando { opacity: .35; }
.bloco.fantasma { position: fixed; z-index: 1000; pointer-events: none; opacity: .92; box-shadow: 0 10px 25px rgba(0,0,0,.5); }
.bloco.travado .ctrl .ind { visibility: hidden; }
.marca-drop { height: 4px; background: var(--acc); border-radius: 2px; margin: -3px 0; }
.lv1 { margin-left: var(--ind); } .lv2 { margin-left: calc(2 * var(--ind)); }
.kw { color: #ff8fd2; } .st { color: #9be89b; } .nu { color: #ffcf70; } .fn { color: #8fd3ff; } .cm { color: #7d8597; }
@media (max-width: 600px) {
  :root { --ind: 22px; }
  .bloco { font-size: .82em; }
  .bloco .cod { white-space: pre-wrap; word-break: break-word; padding: 7px 8px; }
  .area .bloco { flex-wrap: wrap; }
  .area .bloco .cod { flex: 1 1 calc(100% - 40px); }
  .area .bloco .ctrl { flex: 1 0 100%; justify-content: flex-end; border-left: none; border-top: 1px solid #34405a; padding: 0 2px; }
  .area .bloco .ctrl button { padding: 3px 10px; min-width: 38px; }
  .bloco .ctrl button { padding: 6px 4px; min-width: 26px; }
}
.acoes-exec { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
.terminal {
  background: #050507; color: #d6d6d6; border: 2px solid #2a2a33; border-radius: var(--radius); padding: 12px; font-family: var(--mono);
  font-size: .9em; white-space: pre-wrap; word-break: break-word; min-height: 90px; max-height: 360px; overflow: auto;
}
.terminal .in { color: #7dff9b; }
.terminal .err { color: #ff7b85; }
.terminal .info { color: #8fc7ff; }
.terminal .okk { color: #7dff9b; font-weight: 700; }
.terminal .tit { color: #aaa; }

/* ---------- mapa ---------- */
.grade-andares { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.andar-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 180px; }
.andar-card .num { font-size: .8em; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.andar-card h3 { margin: 0; }
.andar-card .estrelas { font-size: 1.4em; letter-spacing: 2px; color: var(--acc); }
.andar-card.bloqueado { opacity: .55; }
.andar-card .faixa { position: absolute; top: 0; left: 0; right: 0; height: 6px; }
.estrela-vazia { color: #4a405c; }

/* ---------- modal / overlays ---------- */
.modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
.modal { background: var(--card); color: var(--txt); border: 2px solid var(--line); border-radius: 14px; padding: 18px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
.modal h2 { margin-top: 0; }
.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #000c; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 900; max-width: 90vw; text-align: center; }
#badge-print { position: fixed; top: 10px; right: 10px; z-index: 950; background: #0b5; color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 700; display: none; }

.foco-fundo { position: fixed; inset: 0; z-index: 980; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.foco-fundo.susto { background: #a0000f; animation: pisca .35s steps(2) infinite; }
@keyframes pisca { 50% { background: #300; } }
.foco-fundo.alivio { background: rgba(10,10,20,.94); }
.foco-caixa { max-width: 620px; }
.foco-caixa h1 { font-size: clamp(1.8em, 6vw, 3.2em); margin: 0 0 10px; }

.morte { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 990; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: escurece 2.5s forwards; }
@keyframes escurece { to { background: rgba(0,0,0,.92); } }
.morte .faixa { width: 100%; background: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); padding: 28px 10px; text-align: center; opacity: 0; animation: surge 2s .6s forwards; }
.morte .faixa h1 { font-family: "Times New Roman", Georgia, serif; font-weight: 400; color: #a3121c; font-size: clamp(2.6em, 11vw, 6em); letter-spacing: .12em; margin: 0; }
@keyframes surge { to { opacity: 1; } }
.morte .sub { color: #ccc; margin-top: 18px; opacity: 0; animation: surge 1s 2.4s forwards; text-align: center; padding: 0 16px; }

.banner-vitoria { text-align: center; padding: 26px 10px; }
.banner-vitoria h1 { font-size: clamp(2em, 8vw, 4em); margin: 0; }
.tremer { animation: tremer .5s 3; }
@keyframes tremer { 25% { transform: translate(-6px, 3px); } 50% { transform: translate(5px, -4px); } 75% { transform: translate(-3px, -2px); } }

/* D20 */
.d20 { width: 150px; height: 150px; display: block; margin: 0 auto; }
.d20.rolando { animation: gira .25s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.d20 text { font-family: var(--head); font-weight: 800; }

/* loja */
.itens { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.item { display: flex; flex-direction: column; gap: 6px; }
.item .ico { font-size: 2em; }

/* professor */
.abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.abas .btn.ativa { border-color: var(--acc); color: var(--acc); }
pre.codigo { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: .85em; margin: 6px 0; white-space: pre; }
table.tab { width: 100%; border-collapse: collapse; font-size: .88em; }
table.tab th, table.tab td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
.zona-drop { border: 2px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; color: var(--muted); }
.zona-drop.sobre { border-color: var(--acc); color: var(--acc); }

/* bônus */
.pixel-grade { display: grid; grid-template-columns: repeat(16, 1fr); width: min(92vw, 420px); aspect-ratio: 1; border: 2px solid var(--line); touch-action: none; background: #fff; }
.pixel-grade div { border: 1px solid rgba(0,0,0,.06); }
.paleta { display: flex; flex-wrap: wrap; gap: 4px; max-width: 420px; }
.paleta button { width: 30px; height: 30px; border: 2px solid #0006; border-radius: 6px; }
.paleta button.sel { outline: 3px solid var(--acc); }
.velha { display: grid; grid-template-columns: repeat(3, 90px); gap: 6px; }
.velha button { width: 90px; height: 90px; font-size: 2.4em; background: var(--bg2); color: var(--txt); border: 2px solid var(--line); border-radius: 10px; }

/* ================= TEMAS ================= */
body[data-tema="t1"] { --bg: #000; --bg2: #000; --card: #000; --line: #fff; --txt: #fff; --muted: #bdbdbd; --acc: #ffd400; --head: "Courier New", var(--mono); --font: "Courier New", var(--mono); --radius: 0; }
body[data-tema="t1"] .card, body[data-tema="t1"] .btn { border-width: 4px; border-radius: 0; }
body[data-tema="t1"] .btn.pri { background: #000; color: #ffd400; border-color: #ffd400; }
body[data-tema="t1"] h1, body[data-tema="t1"] h2 { text-transform: uppercase; letter-spacing: .06em; }

body[data-tema="t2"] { --bg: #1b1d1f; --bg2: #26292b; --card: #2b2e30; --line: #8a7650; --txt: #ece3cf; --muted: #b8ab8f; --acc: #d9b56a;
  --head: "Trajan Pro", "Palatino Linotype", "Book Antiqua", Georgia, serif; --font: Georgia, "Times New Roman", serif;
  background-image: radial-gradient(ellipse at top, #34383b 0%, #1b1d1f 60%); }
body[data-tema="t2"] .card { box-shadow: inset 0 0 0 1px #00000088, 0 0 0 1px #00000088; }
body[data-tema="t2"] .runas { letter-spacing: .5em; color: #8a7650; text-align: center; font-size: 1.1em; }

body[data-tema="t3"] { --bg: #1a0f2e; --bg2: #2a1745; --card: rgba(20,10,35,.86); --line: #ff9d3d; --txt: #fff; --muted: #f6c9a8; --acc: #78ff6a;
  --head: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif; background: linear-gradient(170deg, #ff7a18 0%, #b31f6b 35%, #2b1055 70%, #12082a 100%) fixed; }
body[data-tema="t3"] h1, body[data-tema="t3"] h2, body[data-tema="t3"] h3 { text-shadow: 3px 3px 0 #000; letter-spacing: .02em; }
body[data-tema="t3"] .btn.pri { color: #000; }
.procurado { color: #fff; letter-spacing: 2px; font-size: 1.15em; text-shadow: 2px 2px 0 #000; }
.procurado .on { color: #ffd400; }

body[data-tema="t4"] { --bg: #c9cfd2; --bg2: #e3e6e7; --card: rgba(245,246,246,.82); --line: #8a9399; --txt: #2c3236; --muted: #5d676d; --acc: #3e8e41; --code-bg: #1d2226;
  --head: "Palatino Linotype", "Book Antiqua", Georgia, serif; background: linear-gradient(180deg, #e9ecec 0%, #b9c2c6 55%, #8f9a9f 100%) fixed; }
body[data-tema="t4"] .btn { background: #f3f4f4; }
body[data-tema="t4"] .btn.pri { background: #3e8e41; color: #fff; border-color: #2d6b30; }
body[data-tema="t4"] h1, body[data-tema="t4"] h2 { font-weight: 400; letter-spacing: .14em; }
.anel { width: 34px; height: 34px; }

body[data-tema="t5"] { --bg: #120d0a; --bg2: #21170f; --card: #1c1510; --line: #6b3a1e; --txt: #f2e2cc; --muted: #c4a988; --acc: #ff8a2a;
  --head: "Times New Roman", Georgia, serif; background: radial-gradient(ellipse at bottom, #4a1d07 0%, #120d0a 60%) fixed; }
body[data-tema="t5"] .card { border-image: repeating-linear-gradient(45deg, #8b1a1a 0 6px, #5a0f0f 6px 12px) 4; border-width: 4px; }
body[data-tema="t5"] .btn.pri { background: #c0392b; border-color: #e74c3c; color: #fff; }

body[data-tema="t6"] { --bg: #170506; --bg2: #2a0a0c; --card: rgba(25,6,8,.9); --line: #7d1d22; --txt: #f3e6e6; --muted: #c99a9d; --acc: #e0313c;
  --head: Georgia, "Times New Roman", serif; background: linear-gradient(180deg, #5e0a0f 0%, #2a0507 35%, #170506 100%) fixed; }
body[data-tema="t6"]::before { content: ""; position: fixed; top: 14px; right: 18px; width: 84px; height: 84px; border-radius: 50%; background: #000;
  box-shadow: 0 0 0 3px #ffd9c9, 0 0 26px 10px #ff4b2b, 0 0 90px 40px rgba(142,13,18,.55); pointer-events: none; z-index: 0; }
body[data-tema="t6"] #app { position: relative; z-index: 1; }
body[data-tema="t6"] .btn.pri { background: #8e0d12; border-color: #e0313c; color: #fff; }
body[data-tema="t6"] h1, body[data-tema="t6"] h2 { letter-spacing: .08em; }

body[data-tema="t7"] { --bg: #0b1020; --bg2: #141b33; --card: #161f3b; --line: #3550a0; --acc: #4ff0ff; --head: var(--mono); }


/* ================= CASCA DARK FANTASY (0.3.0) ================= */
body[data-tema="t0"] { background: radial-gradient(ellipse at 50% -10%, #2a2118 0%, #0f0d0b 55%) fixed, #0f0d0b; }
.versalete { font-family: var(--head); font-variant: small-caps; letter-spacing: .07em; }
.ico { width: 1.25em; height: 1.25em; vertical-align: -.25em; flex: none; }
.painel { position: relative; padding: 16px; isolation: isolate; }
.painel::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(30,25,20,.96), rgba(17,14,11,.96));
  border: 1.5px solid rgba(203,189,158,.35); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.6); filter: url(#aspero); }
.painel > h2.tit, .painel > .tit { font-family: var(--head); font-variant: small-caps; letter-spacing: .08em; font-size: 1.25em; margin: 0 0 10px; color: var(--osso);
  border-bottom: 1px solid rgba(203,189,158,.25); padding-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.pergaminho { position: relative; color: var(--tinta); padding: 18px; isolation: isolate; }
.pergaminho::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 30% 20%, #f4ead2 0%, #e4d5b2 55%, #c9b386 100%); box-shadow: inset 0 0 30px rgba(90,60,20,.45); filter: url(#aspero); }
.pergaminho h2, .pergaminho h3 { color: #3a2a18; font-variant: small-caps; letter-spacing: .05em; }
.pergaminho .muted { color: #6d5a3e; }
.pergaminho .btn { background: #2a2118; color: #f2e8d2; border-color: #2a2118; }
.pergaminho .btn.pri { background: #8a1f1f; border-color: #8a1f1f; color: #fff; }
.btn { font-family: var(--font); border-radius: 4px; border-color: #5a4c3a; background: linear-gradient(#231d17, #17130f); color: var(--txt); }
.btn:hover:not(:disabled) { border-color: var(--acc); color: #fff; }
.btn.pri { background: linear-gradient(#e2bd62, #b88a2e); color: #1d1408; border-color: #e2bd62; }
.btn.sangue { background: linear-gradient(#a52828, #6f1414); border-color: #c33; color: #fff; }
.cta { animation: pulso 1.8s infinite; }
@keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(212,168,73,.6); } 50% { box-shadow: 0 0 0 9px rgba(212,168,73,0); } }

/* cabeçalho */
#topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 8px 16px; margin: 0 -16px 14px;
  background: linear-gradient(180deg, rgba(10,8,7,.97), rgba(10,8,7,.85)); border-bottom: 1px solid rgba(203,189,158,.2); backdrop-filter: blur(6px); }
#topo .brasao { width: 46px; height: 46px; flex: none; }
#topo .marca { line-height: 1.05; }
#topo .marca b { font-family: var(--head); font-variant: small-caps; letter-spacing: .1em; font-size: 1.05em; color: var(--osso); display: block; }
#topo .marca span { font-size: .75em; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; }
.bussola { display: flex; align-items: center; gap: 6px; padding: 5px 14px; border: 1px solid rgba(203,189,158,.25); border-radius: 2px;

/* tela inicial */

/* ilustrações animadas do guia */
.ilu { position: relative; height: 230px; border-radius: 8px; background: radial-gradient(ellipse, #2a2219, #15110d); overflow: hidden; border: 1px solid #5a4c3a; color: #ebe2cf; font-family: var(--mono); font-size: 13px; }

@keyframes mt-bloco { 0%,20% { left: 24px; top: 104px; } 55%,100% { left: 58%; top: 70px; } }
@keyframes mt-mao { 0%,15% { left: 70px; top: 128px; opacity: 1; } 20% { left: 70px; top: 120px; } 55% { left: calc(58% + 46px); top: 86px; } 70%,100% { left: calc(58% + 46px); top: 94px; opacity: 0; } }

@keyframes rc-bloco { 0%,35% { left: 30px; } 55%,100% { left: 72px; } }
@keyframes rc-seta { 30%,40% { background: #d4a849; color: #1d1408; transform: scale(1.15); } }
.ilu-falsa .x { position: absolute; color: #e0565b; font-size: 34px; left: 62%; top: 112px; animation: fs-x 3s ease-in-out infinite; font-family: var(--font); }

@keyframes fs-x { 0%,25% { opacity: 0; transform: scale(2); } 40%,100% { opacity: 1; transform: none; } }
@keyframes fs-bloco { 0%,55% { transform: none; opacity: 1; } 60% { transform: translateX(-6px); } 65% { transform: translateX(6px); } 85%,100% { transform: translateY(60px); opacity: 0; } }
.ilu-exec .term { position: absolute; left: 24px; right: 24px; top: 70px; height: 90px; background: #050507; border: 1px solid #333; border-radius: 4px; padding: 8px; color: #7dff9b; }
.ilu-exec .linha { opacity: 0; animation: ex-linha 5s steps(1) infinite; }
.ilu-exec .l2 { animation-delay: .6s; } .ilu-exec .l3 { animation-delay: 1.2s; color: #ff7b85; }
@keyframes ex-linha { 0%,10% { opacity: 0; } 12%,100% { opacity: 1; } }
.ilu-exec .play { position: absolute; left: 24px; top: 24px; background: linear-gradient(#e2bd62, #b88a2e); color: #1d1408; padding: 6px 12px; border-radius: 4px; font-family: var(--font); font-weight: 700; animation: ex-play 5s infinite; }
@keyframes ex-play { 0%,6% { transform: scale(1.12); box-shadow: 0 0 14px #d4a849; } 10%,100% { transform: none; box-shadow: none; } }
.ilu-exec .cor { position: absolute; right: 30px; top: 170px; font-size: 34px; animation: ex-cor 5s infinite; }
@keyframes ex-cor { 0%,30% { opacity: 1; transform: none; filter: none; } 36% { transform: scale(1.4) rotate(-12deg); } 45%,100% { filter: grayscale(1) brightness(.4); transform: none; } }
.ilu-estrelas .linha3 { position: absolute; left: 30px; right: 30px; display: flex; justify-content: space-between; font-family: var(--font); font-size: 22px; }
.ilu-dado .d { position: absolute; left: 50%; top: 40px; width: 110px; height: 110px; margin-left: -55px; animation: gira 1.6s ease-in-out infinite alternate; }
.ilu-dado .res { position: absolute; left: 0; right: 0; top: 168px; text-align: center; font-family: var(--font); font-size: 16px; }
.ilu-loja .moeda { position: absolute; left: 40px; top: 60px; font-size: 34px; animation: lj-moeda 3.2s ease-in-out infinite; }
.ilu-loja .itens-l { position: absolute; right: 20px; top: 40px; display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
.ilu-loja .itens-l span { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #5a4c3a; background: #120f0c; color: #cbbd9e; }
.ilu-loja .itens-l span:nth-child(2) { animation: lj-item 3.2s infinite; }
@keyframes lj-moeda { 0% { transform: none; opacity: 1; } 50% { transform: translate(150px, 10px); opacity: 1; } 60%,100% { transform: translate(170px, 10px) scale(.4); opacity: 0; } }
@keyframes lj-item { 0%,55% { box-shadow: none; } 65%,100% { box-shadow: 0 0 0 3px #d4a849, 0 0 18px #d4a849; } }
.ilu-mapa svg { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); }

@keyframes mp-mk { 0%,15% { transform: translate(40px, 150px); } 45%,55% { transform: translate(150px, 70px); } 85%,100% { transform: translate(270px, 130px); } }
.ilu-saida .tela { position: absolute; left: 30px; top: 30px; width: 170px; height: 110px; border: 3px solid #cbbd9e; border-radius: 6px; background: #0b0a09; }

.ilu-salvar .arq, .ilu-salvar .nuvem { position: absolute; top: 70px; width: 80px; height: 90px; display: grid; place-items: center; border: 2px solid #cbbd9e; background: #17130f; font-family: var(--font); font-size: 12px; text-align: center; border-radius: 6px; }

/* ================= DESEMPENHO (0.5.1) =================

// ===================== MOTOR DE AVALIAÇÃO DOS DESAFIOS =====================
function blocoCodigo(d, bid) {
  const tipo = bid[0], i = Number(bid.slice(1));
  return tipo === 'c' ? d.blocos[i][0] : d.distratores[i][0];
}
function buildSource(d, area) {
  return area.map(b => '    '.repeat(b.l) + blocoCodigo(d, b.bid)).join('\n') + '\n';
}
function gabaritoArea(d) {
  return d.blocos.map((b, i) => ({ bid: 'c' + i, l: b[1] }));
}
function optsTeste(t) {
  return { inputs: t.in, rand: t.rand || [], hoje: t.hoje === undefined ? '2026-10-26' : t.hoje, maxSteps: 50000 };
}
function rodarTeste(src, t) {
  return runPython(src, optsTeste(t));
}
function normOut(s) { return s.split('\n').map(x => x.replace(/\s+$/, '')).join('\n').replace(/\n+$/, ''); }

// status: 'incompleto' (não perde vida) | 'ok' | 'falhou'
function avaliar(d, area) {
  const total = d.blocos.length;
  if (area.length < total) return { status: 'incompleto', faltam: total - area.length };
  const src = buildSource(d, area);
  const gab = buildSource(d, gabaritoArea(d));
  const res = { status: 'ok', testes: [], src };
  for (let i = 0; i < d.testes.length; i++) {
    const t = d.testes[i];
    const r = rodarTeste(src, t);
    const e = rodarTeste(gab, t);
    const item = { run: r, esperado: e };
    if (r.error) { item.ok = false; item.motivo = 'erro'; }
    else if (normOut(r.stdout) !== normOut(e.stdout)) { item.ok = false; item.motivo = 'saida'; }
    else item.ok = true;
    res.testes.push(item);
    if (!item.ok) { res.status = 'falhou'; break; }
  }
  if (res.status === 'ok') {
    const usados = new Set(area.map(b => b.bid));
    const falta = d.blocos.some((_, i) => !usados.has('c' + i));
    if (falta) { res.status = 'falhou'; res.pecaFalsa = true; }
  }
  return res;
}

// QA de um desafio (usado pela suíte do professor e pelos testes no Node)
function qaDesafio(d) {
  const falhas = [];
  const gab = buildSource(d, gabaritoArea(d));
  const saidas = [];
  d.testes.forEach((t, i) => {
    const r = rodarTeste(gab, t);
    if (r.error) falhas.push(`gabarito deu erro no teste ${i + 1}: ${r.error.type}: ${r.error.msg}`);
    saidas.push(normOut(r.stdout));
  });
  if (new Set(saidas).size < 2) falhas.push('os 3 testes produzem a mesma saída (não pegam valor fixo)');
  d.distratores.forEach((dist, k) => {
    const area = gabaritoArea(d);
    area[dist[1]] = { bid: 'd' + k, l: d.blocos[dist[1]][1] };
    const res = avaliar(d, area);
    if (res.status === 'ok') falhas.push(`distrator ${k + 1} passa no lugar do bloco ${dist[1] + 1}: ${dist[0]}`);
  });
  const ok = avaliar(d, gabaritoArea(d));
  if (ok.status !== 'ok') falhas.push('o próprio gabarito não passa na avaliação');
  if (d.testes.length !== 3) falhas.push('não tem 3 testes');
  return { id: d.id, ok: falhas.length === 0, falhas };
}

// confere se parece nome completo; devolve o nome arrumado (Maiúsculas Iniciais)
function validarNome(bruto) {
  const limpo = String(bruto || '').replace(/\s+/g, ' ').trim();
  if (!limpo) return { ok: false, msg: 'Escreva seu nome completo.' };
  if (/\d/.test(limpo)) return { ok: false, msg: 'Nome não tem número. Escreva só o seu nome completo.' };
  if (!/^[\p{L}' -]+$/u.test(limpo)) return { ok: false, msg: 'Use só letras no nome (sem símbolos, pontos ou emojis).' };
  const partes = limpo.split(' ').filter(Boolean);
  const nucleo = partes.filter(p => !PARTICULAS.has(normTxt(p)));
  if (nucleo.length < 2) return { ok: false, msg: 'Escreva o nome COMPLETO: nome e sobrenome, como está na chamada.' };
  for (const p of nucleo) {
    const n = normTxt(p).replace(/ /g, '');
    if (n.length < 2) return { ok: false, msg: `"${p}" não parece parte de um nome. Escreva nome e sobrenome por extenso, sem abreviar.` };
    if (!/[aeiouy]/.test(n)) return { ok: false, msg: `"${p}" não parece um nome de verdade.` };
    if (/(.)\1\1/.test(n)) return { ok: false, msg: `"${p}" tem letra repetida demais. Confira o nome.` };
    if (NOMES_FALSOS.has(n)) return { ok: false, msg: `"${p}" não é nome. Escreva o seu nome completo de verdade.` };
  }
  if (limpo.length > 60) return { ok: false, msg: 'Nome grande demais (máximo 60 letras).' };
  const arrumado = partes.map((p, i) => {
    const low = p.toLocaleLowerCase('pt-BR');
    if (i > 0 && PARTICULAS.has(normTxt(p))) return low;
    return low.replace(/(^|[-'])(\p{L})/gu, (m, a, c) => a + c.toLocaleUpperCase('pt-BR'));
  }).join(' ');
  return { ok: true, nome: arrumado };
}

// ---------- código de conferência (Crockford Base32) ----------
function empacotar(save, quando) {
  const b = baseOficial(save);
  if (save.oficial) quando = save.oficial.fechadoEm;
  const est = [];
  for (let n = 1; n <= 6; n++) est.push((b.andares[n] && b.andares[n].estrelas) || 0);
  const minutos = Math.max(0, Math.min((1 << 24) - 1, Math.floor((quando || Date.now()) / 60000 - EPOCH_MIN)));
  const campos = [
    [SAVE_FMT, 3], [nota10(save), 7],
    ...est.map(e => [e, 2]),
    [totalEstrelas(b) === 18 ? 1 : 0, 1],
    [Math.min(7, b.restauracoes || 0), 3],
    [b.hack ? 1 : 0, 1],
    [b.teste ? 1 : 0, 1],
    [Math.min(63, b.saidasTotal || 0), 6],
    [Math.min(7, b.moedasGanhas || 0), 3],
    [minutos, 24],

  for (const [val, bits] of campos) v = (v << BigInt(bits)) | BigInt(val);
  return v;
}

  const vals = [];
  let shift = BigInt(total);
  for (const w of larguras) { shift -= BigInt(w); vals.push(Number((v >> shift) & ((1n << BigInt(w)) - 1n))); }
  const [fmt, nota, e1, e2, e3, e4, e5, e6, bonus, rest, hack, teste, saidas, moedas, minutos] = vals;
  return { fmt, nota10: nota, estrelas: [e1, e2, e3, e4, e5, e6], bonus, restauracoes: rest, hack, teste, saidas, moedas, quando: new Date((minutos + EPOCH_MIN) * 60000) };

function pngInserirTexto(bytes, chave, texto) {

  while (pos < bytes.length) {
    const len = bdv.getUint32(pos);
    const t = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
    if (t === 'IEND') break;
    pos += 12 + len;
  }
  const out = new Uint8Array(bytes.length + chunk.length);
  out.set(bytes.subarray(0, pos), 0); out.set(chunk, pos); out.set(bytes.subarray(pos), pos + chunk.length);
  return out;
}

// ---------- modal ----------
function abrirModal(html, opts = {}) {
  fecharModal();
  const f = document.createElement('div');
  f.className = 'modal-fundo'; f.id = 'modal-fundo';
  f.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  if (!opts.travado) f.addEventListener('click', (e) => { if (e.target === f) fecharModal(); });
  document.body.appendChild(f);
  const foco = f.querySelector('[autofocus]');
  if (foco) setTimeout(() => foco.focus(), 30);
  return f;
}
function fecharModal() { const m = document.getElementById('modal-fundo'); if (m) m.remove(); }
function confirmar(texto, ok = 'Confirmar', cancelar = 'Cancelar') {
  return new Promise(res => {
    const m = abrirModal(`<p>${texto}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mc-n">${cancelar}</button><button class="btn pri" id="mc-s">${ok}</button></div>`, { travado: true });
    m.querySelector('#mc-n').onclick = () => { fecharModal(); res(false); };
    m.querySelector('#mc-s').onclick = () => { fecharModal(); res(true); };
  });
}
function senhaConfere(txt) { return sha256Hex(normPass(txt)) === CFG.senhaHash; }
function pedirSenha(motivo) {
  if (Date.now() < profAte) return Promise.resolve(true);
  return new Promise(res => {
    const m = abrirModal(`<h2>🔐 Palavra-passe do professor</h2><p class="muted">${escHtml(motivo)}</p>
      <form id="f-senha"><div class="campo"><input id="in-senha" type="password" autocomplete="off" placeholder="frase-com-hifens" autofocus></div>
      <label class="small"><input type="checkbox" id="ver-senha"> mostrar</label>
      <p id="senha-erro" class="fail small"></p>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="s-n">Cancelar</button><button class="btn pri">Liberar</button></div></form>`, { travado: true });
    m.querySelector('#ver-senha').onchange = (e) => { m.querySelector('#in-senha').type = e.target.checked ? 'text' : 'password'; };
    m.querySelector('#s-n').onclick = () => { fecharModal(); res(false); };
    m.querySelector('#f-senha').onsubmit = (e) => {
      e.preventDefault();
      if (senhaConfere(m.querySelector('#in-senha').value)) { profAte = Date.now() + 10 * 60000; senhaSessao = normPass(m.querySelector('#in-senha').value); fecharModal(); res(true); }
      else { m.querySelector('#senha-erro').textContent = 'Palavra-passe errada.'; Som.tocar('erro'); }
    };
  });
}

  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';

}

    const linhas = $$('#area .bloco').filter(x => x !== drag.el);
    let pos = linhas.length;
    for (let k = 0; k < linhas.length; k++) {
      const rr = linhas[k].getBoundingClientRect();
      if (e.clientY < rr.top + rr.height / 2) { pos = k; break; }
    }
    const ind = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ind')) || 30;
    const esq = e.clientX - drag.offX - ra.left - 10;
    const nivel = Math.max(0, Math.min(2, Math.round(esq / ind)));
    return { tipo: 'area', pos, nivel };
  }
  if (pool) {
    const rp = pool.getBoundingClientRect();
    if (e.clientX >= rp.left && e.clientX <= rp.right && e.clientY >= rp.top && e.clientY <= rp.bottom) return { tipo: 'pool' };
  }
  return null;
}
function soltarArrasto(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dr = drag;
  drag = null;
  if (!dr.ativo) return;
  ignorarCliqueAte = Date.now() + 300;
  dr.ghost.remove();
  $$('.marca-drop').forEach(x => x.remove());
  dr.el.classList.remove('arrastando');
  drag = dr;
  const alvo = alvoDrop(e);
  drag = null;
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d) return;
  const m = montagemDe(r, d);
  if (!alvo) return;
  if (alvo.tipo === 'area') {
    let nivel = m.ima && dr.bid[0] === 'c' ? nivelCorreto(d, dr.bid) : alvo.nivel;
    if (dr.onde === 'pool') { adicionarBloco(dr.bid, alvo.pos, nivel); return; }
    const [item] = m.area.splice(dr.i, 1);
    let pos = alvo.pos;
    item.l = nivel;
    m.area.splice(Math.min(pos, m.area.length), 0, item);
    Som.tocar('encaixe');
    mexeu();
  } else if (alvo.tipo === 'pool' && dr.onde === 'area') {
    const [item] = m.area.splice(dr.i, 1);
    m.pool.push(item.bid);
    Som.tocar('clique');
    mexeu();
  }
}

// ---------- executar ----------
function renderEventos(run) {
  let h = '';
  for (const ev of run.events) h += ev.t === 'in' ? `<span class="in">${escHtml(ev.s)}</span>` : escHtml(ev.s);
  if (run.error) {
    if (run.error.kind === 'timeout') h += `<span class="err">\n⏳ O programa passou de 50.000 passos e foi interrompido.\nUm laço que nunca termina? Veja se a variável do while muda dentro do laço.</span>`;
    else h += `<span class="err">${h && !h.endsWith('\n') ? '\n' : ''}${escHtml(run.error.trace)}</span>`;
  }
  return h;
}
function executar() {
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d) return;
  const m = montagemDe(r, d);
  const res = avaliar(d, m.area);
  const t0 = d.testes[0];
  if (res.status === 'incompleto') {
    resultadoPendente = { html: `<span class="info">O programa ainda está incompleto: a solução usa ${d.blocos.length} linhas e o seu tem ${m.area.length}.\nNenhum coração foi perdido.</span>` };
    Som.tocar('clique');
    renderDesafio();
    return;
  }
  const entradas = t0.in.length ? `<span class="tit">$ python dungeon.py   (teste 1 de 3 · entradas: ${escHtml(t0.in.join(', '))})</span>\n` : `<span class="tit">$ python dungeon.py   (teste 1 de 3)</span>\n`;
  const t1 = res.testes[0];
  let html = entradas + renderEventos(t1.run);
  if (res.status === 'ok') {
    html += `\n<span class="okk">✔ Teste 1 · ✔ Teste 2 (oculto) · ✔ Teste 3 (oculto)\nPROGRAMA APROVADO!</span>`;
    r.combo = (r.combo || 0) + 1;
    Som.tocar('acerto');
    resolverAtual(r, d, html);
    return;
  }
  // falhou
  const didatica = htmlRaciocinio(d, res, m.area);
  const fi = res.testes.length - 1;
  const tf = res.testes[fi];
  if (res.pecaFalsa) {
    html += `\n<span class="err">✘ A saída bateu, mas tem peça falsa no lugar de uma verdadeira.</span>`;
  } else if (fi === 0 && tf.motivo === 'saida') {
    html += `\n<span class="err">✘ Teste 1: a saída ficou diferente da esperada.</span>\n<span class="tit">Saída esperada:</span>\n${renderEventos(tf.esperado)}`;
  } else if (fi > 0) {
    html += `\n<span class="okk">✔ Teste 1</span>\n<span class="err">✘ Teste ${fi + 1} (oculto): com outros valores, ${tf.motivo === 'erro' ? `o programa deu erro (${escHtml(tf.run.error.type)})` : 'a saída ficou errada'}.\nTem algum valor fixo no código, ou a conta só funciona por sorte?</span>`;
  } else {
    html += `\n<span class="err">✘ O programa deu erro. Leia a última linha vermelha: ela diz o que aconteceu.</span>`;
  }
  r.combo = 0;
  Som.tocar('erro');
  const morreu = perderCoracao(r);
  if (morreu) return;
  let botao = '';
  const outrosNormais = r.fila.filter(id => id !== d.id && DES[id].dif !== 'B').length;
  if (d.dif !== 'B' && outrosNormais > 0) {
    r.fila.shift();
    r.fila.splice(r.fila.length - 1, 0, d.id);
    html += `\n<span class="info">Esse desafio foi para o fim da fila. Você volta nele antes do BOSS.</span>`;
    botao = `<button class="btn pri cta" data-acao="proximo">Próximo desafio ▶</button>`;
    resultadoPendente = { html, botao, bloqueia: true, fixo: true, didatica };
    persistir();
    renderCongelado(d);
  } else {
    resultadoPendente = { html, didatica };
    persistir();
    renderDesafio();
  }
  const tela = $('#view'); if (tela) { tela.classList.add('tremer'); setTimeout(() => tela.classList.remove('tremer'), 1600); }
}
function perderCoracao(r) {
  if (r.tutorial) { r.vidas = Math.max(1, r.vidas - 1); r.perdidos++; Som.tocar('coracao'); return false; }
  if (r.sandbox || god()) { toast('Modo professor: o coração não foi perdido.'); return false; }
  r.vidas--; r.perdidos++;
  Som.tocar('coracao');
  persistir();
  if (r.vidas <= 0) { morrer('Seus 3 corações acabaram.'); return true; }
  return false;
}
function resolverAtual(r, d, html) {
  r.fila.shift();
  r.resolvidos.push(d.id);
  const acabou = r.fila.length === 0;
  const botao = acabou
    ? `<button class="btn pri grande cta" data-acao="concluir">🏁 Concluir andar</button>`
    : (DES[r.fila[0]].dif === 'B' ? `<button class="btn pri grande cta" data-acao="proximo">👑 Enfrentar o BOSS ▶</button>` : `<button class="btn pri cta" data-acao="proximo">Próximo desafio ▶</button>`);
  resultadoPendente = { html, botao, bloqueia: true, fixo: true, voltarPara: d.id, didatica: htmlPorque(d) };

}
function renderCongelado(d) {

function concluirAndar() {

function abrirD20() {
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d) return;
  const dado = r.dados[d.id];
  if (dado && dado.sucesso) { verDica(); return; }

  mostrarResultadoDado(false);
}
function rolarD20(pagandoVida) {
  const r = ctxRun(), d = desafioAtual();
  const cd = DIF_INFO[d.dif].cd;
  if (pagandoVida) {
    if (r.vidas <= 1 && !god() && !r.sandbox) return;
    if (perderCoracao(r)) return;
  }
  const nat = randInt(20) + 1;
  const bonus = r.bardo ? randInt(4) + 1 : 0;
  const total = nat + bonus;
  const dado = r.dados[d.id] || (r.dados[d.id] = { rolagens: [], sucesso: false, critico: false });
  dado.rolagens.push({ nat, bonus, total });
  dado.sucesso = total >= cd || nat === 20;
  if (nat === 20) {
    dado.critico = true;
    const m = montagemDe(r, d);
    const vivos = d.distratores.map((_, i) => 'd' + i).filter(b => !m.removidos.includes(b));
    if (vivos.length) {
      const alvo = vivos[randInt(vivos.length)];
      m.removidos.push(alvo);
      const ai = m.area.findIndex(b => b.bid === alvo);
      if (ai >= 0) m.area.splice(ai, 1);
      const pi = m.pool.indexOf(alvo);
      if (pi >= 0) m.pool.splice(pi, 1);
      dado.destruiu = blocoCodigo(d, alvo);
    }
  }
  persistir(); // grava ANTES da animação (F5 não muda o resultado)
  Som.tocar('dado');
  abrirModal(`<h2 style="text-align:center">🎲 Rolando o D20…</h2>${svgD20('?', 'rolando')}<p class="muted" style="text-align:center">CD ${cd}</p>`, { travado: true });
  let k = 0;
  const iv = setInterval(() => {
    const t = $('#modal-fundo text');
    if (t) t.textContent = randInt(20) + 1;
    if (++k > 9) { clearInterval(iv); mostrarResultadoDado(true); }
  }, 110);
}
function mostrarResultadoDado(acabouDeRolar) {
  const r = ctxRun(), d = desafioAtual();
  const cd = DIF_INFO[d.dif].cd;
  const dado = r.dados[d.id];
  const ult = dado.rolagens[dado.rolagens.length - 1];
  if (acabouDeRolar) Som.tocar(ult.nat === 20 ? 'critico' : (dado.sucesso ? 'acerto' : 'erro'));

      <p class="small muted">Coração gasto aqui conta como coração perdido (tira estrela).</p>`;
  }
  abrirModal(`<h2 style="text-align:center">🎲 D20 · CD ${cd}</h2>${svgD20(ult.total)}
    <p style="text-align:center" class="muted">Dado: ${ult.nat}${ult.bonus ? ` + Bardo ${ult.bonus} = ${ult.total}` : ''}</p>

  if (acabouDeRolar && ult.nat === 20) renderDesafio();
}

async function usarItem(id) {
  const r = ctxRun(), d = desafioAtual();
  const it = ITENS.find(x => x.id === id);
  if (!r || !d || !it || !(S.inv[id] > 0)) return;
  const m = montagemDe(r, d);
  const regras = {
    'ITEM-01': () => r.bardo ? 'O Dado de Bardo já está ativo neste andar.' : null,
    'ITEM-02': () => r.vidas >= 3 ? 'Seus corações já estão cheios.' : null,
    'ITEM-03': () => d.dif === 'B' ? 'O Pergaminho não funciona contra o BOSS.' : null,
    'ITEM-04': () => d.distratores.every((_, i) => m.removidos.includes('d' + i)) ? 'Não sobrou peça falsa neste desafio.' : null,
    'ITEM-05': () => m.ima ? 'O Ímã já está ativo neste desafio.' : null,
  };
  const bloqueio = regras[id] && regras[id]();
  if (bloqueio) { toast(bloqueio); return; }
  if (!(await confirmar(`Usar <b>${it.icone} ${escHtml(it.nome)}</b>?<br><span class="small muted">${escHtml(it.efeito)}</span>`, 'Usar'))) return;
  S.inv[id]--;
  switch (id) {
    case 'ITEM-01': r.bardo = true; break;
    case 'ITEM-02': r.vidas = Math.min(3, r.vidas + 1); Som.tocar('acerto'); break;
    case 'ITEM-03': {
      r.fila.shift(); r.resolvidos.push(d.id);
      persistir(); toast('⏭ Desafio pulado.');
      resultadoPendente = null;
      if (!r.fila.length) concluirAndar(); else renderDesafio();
      return;
    }
    case 'ITEM-04':
      d.distratores.forEach((_, i) => {
        const b = 'd' + i;
        if (!m.removidos.includes(b)) m.removidos.push(b);
        const ai = m.area.findIndex(x => x.bid === b); if (ai >= 0) m.area.splice(ai, 1);
        const pi = m.pool.indexOf(b); if (pi >= 0) m.pool.splice(pi, 1);
      });
      break;
    case 'ITEM-05':
      m.ima = true;
      m.area.forEach(b => { b.l = nivelCorreto(d, b.bid); });
      break;
  }
  Som.tocar('moeda');
  mexeu();
}
// ---------- foco / saída de tela ----------
let awayStart = null;
let pausaFocoAte = 0;
function vigiando() {
  if (!S || !S.run || sandbox || god()) return false;
  if (telaAtual !== 'desafio') return false; // mapa, loja, intro e área do professor são zona segura
  if (Date.now() < pausaFocoAte) return false;
  if (S.run.printp && Date.now() < S.run.printp.ate) return false;
  return true;
}
function saiu() {
  if (!vigiando() || awayStart !== null) return;
  awayStart = Date.now();
  S.run.away = awayStart;
  persistir();
}
function voltou() {
  if (awayStart === null) return;
  const dur = Date.now() - awayStart;
  awayStart = null;
  if (!S || !S.run) return;
  S.run.away = null;
  if (!vigiando()) { persistir(); return; }
  if (dur > 2000) { infracao(`Você ficou ${Math.round(dur / 1000)} s fora da tela.`); return; }
  const agora = Date.now();
  S.run.micro = (S.run.micro || []).filter(t => agora - t < 30000);
  S.run.micro.push(agora);
  if (S.run.micro.length >= 3) { S.run.micro = []; infracao('3 saídas rápidas em menos de 30 segundos.'); return; }
  persistir();
}
function verificarSaidaPendente() {
  if (S && S.run && S.run.away) {
    const passou = Date.now() - S.run.away;
    S.run.away = null;
    if (passou < 10 * 60000 && !god()) S.run.pendente = `A página foi fechada ou recarregada no meio do andar (${Math.round(passou / 1000)} s fora).`;
  }
}

function iniciarVigia() {

  window.addEventListener('focus', voltou);
  window.addEventListener('pagehide', saiu);

let bufTeclas = '', bufTempo = 0;
function teclaDigitada(e) {
  const alvo = e.target;
  if (alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.tagName === 'SELECT')) return;
  if (e.ctrlKey && e.altKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); abrirProf(); return; }
  if (!/^[a-zA-Z]$/.test(e.key)) return;
  const agora = Date.now();
  if (agora - bufTempo > 2500) bufTeclas = '';
  bufTempo = agora;
  bufTeclas = (bufTeclas + e.key.toUpperCase()).slice(-12);
  if (bufTeclas.endsWith('PRINTP')) { bufTeclas = ''; liberarPrint(); }
  else if (bufTeclas.endsWith('SINAL')) { bufTeclas = ''; sinal(); }
  else if (bufTeclas.endsWith('GODMODE')) { bufTeclas = ''; ativarGod(); }
}
async function liberarPrint() {
  if (!S || !S.run) { toast('Fora de um andar não precisa: pode tirar o print à vontade.'); return; }
  if (S.run.printp.usados >= 3) { toast('Limite de 3 liberações de print nesta tentativa.'); return; }
  if (!(await pedirSenha('Liberar 60 segundos sem penalidade de foco para tirar print.'))) return;
  S.run.printp.usados++;
  S.run.printp.ate = Date.now() + 60000;
  persistir();
  toast('📸 60 segundos liberados.');
}
async function sinal() {

// ---------- placar PNG ----------
function desenharPlacar(save, checkpoint) {
  const W = 1080, H = 1500;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1f1a2a'); grad.addColorStop(1, '#0b0910');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#f0b429'; g.lineWidth = 10; g.strokeRect(24, 24, W - 48, H - 48);
  g.fillStyle = '#a79bbd'; g.font = '600 30px sans-serif'; g.textAlign = 'center';
  g.fillText('DUNGEON DO PYTHON II · BLOCOS DO DESTINO', W / 2, 95);
  g.fillStyle = '#fff'; g.font = '800 70px sans-serif';
  g.fillText(checkpoint ? 'CHECKPOINT' : 'PLACAR', W / 2, 180);
  g.font = '600 40px sans-serif'; g.fillStyle = '#ece6f5';
  g.fillText(save.id.nome.slice(0, 40), W / 2, 260);
  g.font = '30px sans-serif'; g.fillStyle = '#a79bbd';
  g.fillText(`Nº ${save.id.numero} · ${rotuloTurma(save.id)}`, W / 2, 305);
  const esc = CFG.escolas.find(x => x.sigla === save.id.escola);
  if (esc) { g.font = '24px sans-serif'; g.fillText(esc.nome.slice(0, 70), W / 2, 342); }
  g.fillStyle = '#f0b429'; g.font = '800 120px sans-serif';
  g.fillText(notaTexto(save), W / 2, 468);
  g.font = '28px sans-serif'; g.fillStyle = '#a79bbd';
  g.fillText(`nota de 0 a 10 · ${totalOficial(save)} de 18 estrelas${save.oficial ? ' · 1ª jornada (oficial)' : ''}`, W / 2, 512);
  g.textAlign = 'left';
  for (let n = 1; n <= 6; n++) {
    const y = 560 + (n - 1) * 78;
    const A = ANDARES[n];
    const bo = baseOficial(save);
    const e = (bo.andares[n] && bo.andares[n].estrelas) || 0;
    g.fillStyle = '#241e31'; g.fillRect(80, y, W - 160, 64);
    g.fillStyle = '#ece6f5'; g.font = '600 32px sans-serif';
    g.fillText(`${n}. ${A.nome}`, 105, y + 43);
    g.font = '40px sans-serif';
    for (let k = 0; k < 3; k++) { g.fillStyle = k < e ? '#f0b429' : '#4a405c'; g.fillText('★', W - 260 + k * 52, y + 47); }
  }
  let y = 1060;
  g.font = '30px sans-serif'; g.fillStyle = '#ece6f5';
  const linhas = [
    `Moedas ganhas: ${baseOficial(save).moedasGanhas || 0} · Saídas de tela: ${baseOficial(save).saidasTotal || 0} · Restaurações: ${baseOficial(save).restauracoes || 0}`,
    `Sala Secreta: ${salaAberta(save) ? 'DESBLOQUEADA' : 'trancada'}`,
    ...(save.oficial ? [`Jornada ${save.jornada} em andamento: ${totalEstrelas(save)}/18 estrelas (não vale nota)`, `Nota congelada em ${new Date(save.oficial.fechadoEm).toLocaleDateString('pt-BR')}`] : []),
  ];
  if (save.hack) linhas.push('[TENTATIVA DE HACK F12]');
  if (save.teste) linhas.push('[MODO PROFESSOR / TESTE]');
  if (checkpoint && save.run) linhas.push(`Andar ${save.run.andar} em andamento · ${save.run.resolvidos.length}/4 resolvidos · ${save.run.vidas} ❤`);
  for (const l of linhas) { g.fillStyle = l.startsWith('[') ? '#ff5c6c' : '#ece6f5'; g.fillText(l, 90, y); y += 46; }
  const agora = Date.now();
  g.textAlign = 'center';
  g.fillStyle = '#a79bbd'; g.font = '28px sans-serif';
  g.fillText('Código de conferência', W / 2, 1300);
  g.fillStyle = '#fff'; g.font = '700 58px monospace';
  g.fillText(codigoConferencia(save, agora), W / 2, 1370);
  g.fillStyle = '#a79bbd'; g.font = '24px sans-serif';
  g.fillText(`${new Date(agora).toLocaleString('pt-BR')} · v${APP_VERSION}`, W / 2, 1430);
  return { canvas: c, quando: agora };
}
function canvasParaBytes(canvas) {
  return new Promise((res, rej) => {
    canvas.toBlob(b => {
      if (!b) { rej(new Error('toBlob falhou')); return; }
      b.arrayBuffer().then(ab => res(new Uint8Array(ab)), rej);
    }, 'image/png');
  });
}
function baixarBlob(blob, nome) {
  pausaFocoAte = Date.now() + 6000;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function baixarPlacar(checkpoint, silencioso) {
  try {
    const { canvas } = desenharPlacar(S, checkpoint);
    const bytes = await canvasParaBytes(canvas);
    const comDados = pngInserirTexto(bytes, PNG_KEY, pacotePNG(S, checkpoint));
    const nome = `${checkpoint ? 'checkpoint' : 'placar'}_${normTxt(S.id.nome).replace(/ /g, '_')}_${S.id.numero}.png`;
    baixarBlob(new Blob([comDados], { type: 'image/png' }), nome);
    if (silencioso) { toast('💾 Placar salvo em ' + nome, 4000); return; }
    abrirModal(`<h2>🏆 ${checkpoint ? 'Checkpoint' : 'Placar'} baixado</h2>
      <p>O arquivo <b>${escHtml(nome)}</b> foi para a pasta de downloads.</p>
      <ol class="small"><li>Envie esse <b>arquivo</b> no Classroom (ou no formulário).</li><li><b>Não</b> mande print da tela nem pelo WhatsApp: eles estragam os dados escondidos na imagem.</li>
      ${checkpoint ? '<li>Na próxima aula, use "Já joguei em outro aparelho" para continuar do mesmo desafio.</li>' : ''}</ol>
      <p>Código de conferência: <code>${codigoConferencia(S)}</code></p>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" data-acao="fechar-modal">OK</button></div>`);
  } catch (e) {
    toast('Não consegui gerar o PNG: ' + e.message, 5000);
  }
}
function escolherArquivo(accept, multiplo) {
  return new Promise(res => {
    pausaFocoAte = Date.now() + 60000;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.multiple = !!multiplo;
    inp.onchange = () => { pausaFocoAte = Date.now() + 3000; res(Array.from(inp.files || [])); };
    inp.click();
  });
}
async function restaurarPNG() {
  const [f] = await escolherArquivo('image/png');
  if (!f) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  const lido = pngLerTexto(bytes, PNG_KEY);
  if (lido.erro) { abrirModal(`<h2>Não deu</h2><p>Esse arquivo não serve: ${escHtml(lido.erro)}.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-acao="fechar-modal">OK</button></div>`); return; }
  const p = lerPacotePNG(lido.texto);
  if (p.erro) { toast('Não deu: ' + p.erro, 5000); return; }
  const sv = p.save;
  if (!p.valido) { sv.moedas = 0; sv.inv = {}; sv.hack = (sv.hack || 0) + 1; }
  const local = carregarPerfil(sv.id).save;
  if (local && (local.seq || 0) > (sv.seq || 0)) {
    if (!(await confirmar(`Este aparelho já tem progresso de <b>${escHtml(sv.id.nome)}</b> mais novo que o PNG. Trocar pelo PNG mesmo assim?`, 'Trocar'))) return;
  }
  sv.restauracoes = (sv.restauracoes || 0) + 1;
  if (sv.run) sv.run.away = null;
  S = sv;
  gravar(S);
  toast(p.checkpoint && sv.run ? 'Checkpoint carregado: você volta no mesmo desafio.' : 'Progresso carregado.', 4000);
  if (!p.valido) { julgamento(); return; }
  mostrar('mapa');
}
function abrirForms() {

  else botoes = `<p class="small">Termine o Andar ${r.andar} primeiro (ou morra tentando).</p>`;
  return `<div class="pergaminho det-andar">
    <div class="small muted">ANDAR ${n} · ${escHtml(A.jogo).toUpperCase()}</div>

}

// ---------- voz (Web Speech API) ----------
// O botão só funciona onde existe voz em português. Isso depende do navegador E do computador,
// então o jogo testa na hora (não adivinha pelo nome do navegador).
function vozPt() {
  try {
    const vozes = (speechSynthesis.getVoices() || []).filter(v => /^pt([-_]|$)/i.test(v.lang));

function falar(texto) {
  try {
    const v = ('speechSynthesis' in window) ? vozPt() : null;
    if (!v) { infoVoz(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = v.lang; u.rate = 0.95;
    try { u.voice = v; } catch (e) { /* alguns navegadores só aceitam o idioma */ }
    u.onerror = () => infoVoz();
    speechSynthesis.speak(u);
  } catch (e) { infoVoz(); }
}
function calar() { try { speechSynthesis.cancel(); } catch (e) { } }
try {

function tickTutorial() {
  if (!tut) return;
  const p = TUT_PASSOS[tut.passo];

  desenharTutorial(true);
}
function desenharTutorial(soPosicao) {
  if (!tut) return;
  const modalAberto = !!document.getElementById('modal-fundo');
  ['tut-spot', 'tut-caixa'].forEach(id => { const e = document.getElementById(id); if (e) e.style.visibility = modalAberto ? 'hidden' : ''; });
  if (modalAberto) return;
  const p = TUT_PASSOS[tut.passo];
  const alvo = p.alvo ? $(p.alvo) : null;
  let spot = document.getElementById('tut-spot');
  if (alvo) {
    if (!spot) { spot = document.createElement('div'); spot.id = 'tut-spot'; document.body.appendChild(spot); }
    if (tut.ultimoAlvo !== p.alvo + tut.passo) { alvo.scrollIntoView({ block: 'center', behavior: 'smooth' }); tut.ultimoAlvo = p.alvo + tut.passo; }
    const r = alvo.getBoundingClientRect();
    Object.assign(spot.style, { left: (r.left - 6) + 'px', top: (r.top - 6) + 'px', width: (r.width + 12) + 'px', height: (r.height + 12) + 'px', display: 'block' });
  } else if (spot) spot.style.display = 'none';
  const texto = typeof p.texto === 'function' ? p.texto() : p.texto;
  const botoes = typeof p.botoes === 'function' ? p.botoes() : (p.botoes || []);
  let cx = document.getElementById('tut-caixa');
  const chave = tut.passo + '|' + texto + '|' + botoes.map(b => b[0]).join();
  const emBaixo = !alvo || alvo.getBoundingClientRect().top < window.innerHeight * 0.5;
  if (cx && soPosicao && cx.dataset.chave === chave) { cx.style.top = emBaixo ? '' : '76px'; cx.style.bottom = emBaixo ? '12px' : ''; return; }
  if (!cx) { cx = document.createElement('div'); cx.id = 'tut-caixa'; cx.className = 'painel'; document.body.appendChild(cx); }
  cx.dataset.chave = chave;
  cx.style.top = emBaixo ? '' : '76px'; cx.style.bottom = emBaixo ? '12px' : '';
  cx.innerHTML = `${svgBit()}<div class="fala"><b>Bit</b> <span class="passo">· passo ${tut.passo + 1} de ${TUT_PASSOS.length}</span>
    <p>${texto}</p>

      ${htmlBtnOuvir('data-tut="ouvir"', 'Ouvir', true)}
      ${tut.passo > 0 && tut.passo < TUT_PASSOS.length - 1 ? '<button class="btn mini" data-tut="sair">Sair do treino</button>' : ''}</div></div>`;
  cx.querySelectorAll('[data-tut]').forEach(b => b.onclick = () => {
    const a = b.dataset.tut;
    if (a === 'prox') { tut.passo++; Som.tocar('clique'); desenharTutorial(); }
    else if (a === 'sair') sairTutorial(false);
    else if (a === 'fim') sairTutorial(true);
    else if (a === 'ouvir') falar(cx.querySelector('.fala p').textContent);
    else if (a === 'demo') demoSaida();
  });
}

// tradutor de erros do Python para o raciocínio (sem citar comandos)
const TRADUCOES = [
  [/IndentationError: expected an indented block/, "Uma linha que abre um bloco (ela termina com dois-pontos) precisa ter pelo menos uma linha logo abaixo, um degrau para a direita. A linha seguinte ficou no mesmo degrau."],

  [/forgot a comma/, "Dois pedaços estão encostados sem separador entre eles. O Python não sabe onde um termina e o outro começa."],

  [/was never closed|does not match opening/, "Um parêntese (ou colchete) abriu e não fechou. Conte quantos abrem e quantos fecham."],

  [/SyntaxError/, "Uma linha tem algo que o Python não entende: um sinal na ordem trocada, uma condição num lugar que não aceita condição, ou uma linha que só faz sentido logo depois de outra."],
  [/forget to import/, "Uma ferramenta de biblioteca está sendo usada sem a caixa de ferramentas ter sido trazida antes, ou sem o nome da caixa na frente."],
  [/NameError|UnboundLocalError/, "O Python não conhece uma palavra usada no programa. Ou ela foi escrita diferente (maiúscula conta), ou está sendo usada ANTES de existir: a linha que cria a caixa precisa vir antes da linha que usa."],
  [/can only concatenate str/, "O sinal de mais tentou grudar texto com número. Ele junta texto com texto ou soma número com número, nunca os dois misturados."],
  [/unsupported operand/, "Uma conta está misturando número com texto. Lembre: a resposta digitada pela pessoa chega como texto."],
  [/can't multiply sequence/, "Uma conta tentou multiplicar texto por algo que não é um número inteiro. Confira se todas as respostas digitadas viraram número."],
  [/not subscriptable/, "Colchetes servem para pegar um item de uma lista. Para mandar alguma coisa fazer uma ação, o sinal é outro."],
  [/cannot unpack|values to unpack/, "O programa tentou separar valores em caixas, mas a quantidade não bate: tem mais caixas do que valores (ou o contrário)."],
  [/not supported between/, "Uma comparação está entre texto e número. A resposta digitada chegou como texto."],
  [/missing \d+ required positional/, "Uma receita foi usada com menos valores do que ela precisa receber."],
  [/is not iterable/, "A repetição tentou passar por algo que não é uma lista nem uma faixa de números."],
  [/is not callable/, "Uma caixa de valor foi usada como se fosse uma ação."],
  [/has no attribute/, "Uma ação foi pedida para algo que não sabe fazer essa ação, ou ela foi procurada no lugar errado da caixa de ferramentas."],
  [/invalid literal for int/, "Uma resposta com casa decimal (ou com letras) não pode virar número inteiro."],
  [/could not convert string to float/, "A resposta não parece um número. Lembre: o Python usa ponto, não vírgula."],
  [/ZeroDivisionError/, "Uma conta dividiu por zero."],
  [/EOFError/, "O programa fez mais perguntas do que o teste tem respostas. Alguma pergunta está sobrando, repetida, ou dentro de uma repetição onde não devia."],
  [/Timeout/, "A repetição nunca termina: nada lá dentro faz a condição ficar falsa (ou a linha que muda a condição ficou fora do bloco)."],
];
function traduzirErro(err) {
  if (!err) return null;
  const s = `${err.type}: ${err.msg}`;
  for (const [re, txt] of TRADUCOES) if (re.test(s)) return txt;
  return 'O programa parou com um erro. A última linha vermelha do terminal diz o tipo do problema.';
}

// texto com `código` -> HTML
function mdCodigo(t) { return escHtml(t).replace(/`([^`]+)`/g, '<code>$1</code>'); }

function primeiraAparicao() {
  const vistos = {};
  for (const d of DESAFIOS) for (const c of (d.conceitos || [])) if (!(c in vistos)) vistos[c] = d.andar;
  return vistos;
}
function conceitosDoAndar(n) {
  const p = primeiraAparicao();
  return Object.keys(CONCEITOS).filter(c => p[c] === n);
}
const CACHE_SAIDA = {};
function saidaExemplo(c) {
  if (CACHE_SAIDA[c.exemplo]) return CACHE_SAIDA[c.exemplo];
  const r = runPython(c.exemplo + '\n', { inputs: c.entradas || [], rand: [4], hoje: '2026-10-27', maxSteps: 5000 });
  return (CACHE_SAIDA[c.exemplo] = renderEventos(r));
}
function htmlConceito(id, aberto) {
  const c = CONCEITOS[id];
  if (!c) return '';
  return `<details class="conceito" ${aberto ? 'open' : ''}><summary>${ico('guia')} ${escHtml(c.nome)}</summary>
    <p>${mdCodigo(c.texto)}</p>
    <div class="ex-grade"><div><div class="small muted">Exemplo</div><pre class="codigo">${realceBloco(c.exemplo)}</pre></div>
    <div><div class="small muted">Saída${c.entradas ? ' (digitando: ' + escHtml(c.entradas.join(', ')) + ')' : ''}${c.aleatorio ? ' (cada vez sai um número)' : ''}</div><pre class="codigo saida">${saidaExemplo(c)}</pre></div></div>
  </details>`;
}
function realceBloco(src) { return src.split('\n').map(l => realce(l)).join('\n'); }

// explicação quando ACERTA
function htmlPorque(d) {
  if (!d.porque) return '';
  const linhas = d.blocos.map((b, i) => `<li><pre class="codigo lin">${'    '.repeat(b[1])}${realce(b[0])}</pre><p>${mdCodigo(d.porque[i] || '')}</p></li>`).join('');
  const cs = (d.conceitos || []).filter(c => CONCEITOS[c]);
  return `<div class="didatica ok">
    <h3>${ico('guia')} Por que funcionou</h3>
    <ol class="porque">${linhas}</ol>
    ${cs.length ? `<div class="small muted" style="margin-top:8px">Conceitos deste desafio (estão no ${ico('pergaminho')} Grimório):</div>${cs.map(c => htmlConceito(c, false)).join('')}` : ''}
  </div>`;
}
// raciocínio quando ERRA (sem citar comandos)
function htmlRaciocinio(d, res, area) {
  if (!d.logica) return '';
  const partes = [];
  const ult = res.testes && res.testes[res.testes.length - 1];
  const falsa = area.find(b => b.bid[0] === 'd');
  if (falsa && d.falsas) partes.push(`<p><b>${ico('lupa')} Pista:</b> ${escHtml(d.falsas[Number(falsa.bid.slice(1))] || '')}</p>`);
  const erroNaFalsa = falsa && ult && ult.run && ult.run.error && area[ult.run.error.line - 1] === falsa;
  if (ult && ult.run && ult.run.error && !erroNaFalsa) {
    const e = ult.run.error.kind === 'timeout' ? { type: 'Timeout', msg: '' } : ult.run.error;
    partes.push(`<p><b>${ico('olho')} O que o erro quer dizer:</b> ${escHtml(traduzirErro(e))}</p>`);
  } else if (!falsa && res.testes && res.testes.length > 1) {
    partes.push(`<p><b>${ico('olho')} O que aconteceu:</b> no teste 1 deu certo, mas com outros valores não. Alguma conta está presa a um número fixo, ou a regra só funciona por coincidência.</p>`);
  } else if (!falsa) {
    partes.push(`<p><b>${ico('olho')} O que aconteceu:</b> o programa rodou, mas mostrou algo diferente do esperado. Compare linha por linha: tem algo a mais, a menos ou fora de ordem? Lembre que o degrau decide se a linha roda dentro ou fora de uma pergunta ou repetição.</p>`);
  }
  return `<div class="didatica erro">
    <h3>${ico('mapa')} Entenda o raciocínio</h3>
    ${partes.join('')}
    <details><summary>O caminho do programa, em palavras</summary><ol>${d.logica.map(p => `<li>${escHtml(p)}</li>`).join('')}</ol></details>
  </div>`;
}

// ---------- PIXEL ART ----------
// Pinta só com o botão apertado (ou o dedo encostado). Antes, depois do 1º traço o pincel ficava "preso".
function bonusPixel() {
  const c = $('#bonus-corpo');
  c.innerHTML = `<div class="row" style="align-items:flex-start;gap:18px">
    <div class="pixel-grade" id="pgrade">${pixelGrade.map((cor, i) => `<div data-p="${i}" style="background:${cor}"></div>`).join('')}</div>
    <div style="max-width:420px">
      <p>Clique (ou toque) num quadrado para pintar. Para pintar vários, segure o botão e arraste.</p>
      <div class="paleta">${PIXEL_PALETA.map(cor => `<button aria-label="cor ${cor}" data-cor="${cor}" class="${cor === pixelCor ? 'sel' : ''}" style="background:${cor}"></button>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="p-desfazer">↶ Desfazer</button><button class="btn" id="p-limpar">🧽 Limpar</button><button class="btn pri" id="p-baixar">⬇ Baixar PNG</button></div>
    </div></div>`;
  const grade = $('#pgrade');
  let pintando = false, pid = null;
  const historico = [];
  const salvar = () => store.set('pixel:' + perfilKey(S.id), JSON.stringify(pixelGrade));
  const pinta = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (!el || el.dataset.p === undefined || !grade.contains(el)) return;
    const i = Number(el.dataset.p);
    if (pixelGrade[i] === pixelCor) return;
    pixelGrade[i] = pixelCor; el.style.background = pixelCor;
  };
  const termina = () => { if (!pintando) return; pintando = false; pid = null; salvar(); };
  grade.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    historico.push(pixelGrade.slice()); if (historico.length > 30) historico.shift();
    pintando = true; pid = e.pointerId;
    try { grade.setPointerCapture(e.pointerId); } catch (er) { }
    pinta(e.clientX, e.clientY);
  });
  grade.addEventListener('pointermove', (e) => {
    if (!pintando || e.pointerId !== pid) return;
    if (e.pointerType === 'mouse' && !(e.buttons & 1)) { termina(); return; }
    pinta(e.clientX, e.clientY);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => grade.addEventListener(ev, termina));
  $$('[data-cor]', c).forEach(b => b.onclick = () => { pixelCor = b.dataset.cor; $$('[data-cor]', c).forEach(x => x.classList.toggle('sel', x === b)); });
  $('#p-desfazer').onclick = () => { if (!historico.length) return; pixelGrade = historico.pop(); salvar(); bonusPixel(); };
  $('#p-limpar').onclick = () => { historico.push(pixelGrade.slice()); pixelGrade = Array(256).fill('#ffffff'); salvar(); bonusPixel(); };
  $('#p-baixar').onclick = () => {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
    const g = cv.getContext('2d');
    pixelGrade.forEach((cor, i) => { g.fillStyle = cor; g.fillRect((i % 16) * 32, Math.floor(i / 16) * 32, 32, 32); });
    cv.toBlob(b => baixarBlob(b, `pixelart_${normTxt(S.id.nome).replace(/ /g, '_')}.png`), 'image/png');
  };
}

// ---------- JOGO DA VELHA ----------
const FALAS_MESTRE = {
  inicio: ['* O Mestre da Dungeon sorri. Isso enche ele de DETERMINAÇÃO.', 'Eu era um jogador como você, até levar um X no joelho.', 'Ah, lá vamos nós de novo.', 'Louvado seja o Sol. E o canto do tabuleiro.'],
  bloqueio: ['Bloqueado! Achou que eu não ia ver?', 'Nem pense nisso.', 'Essa linha é minha.', 'A causalidade fechou esse caminho.'],
  armadilha: ['Hmm… agora eu tenho duas saídas.', 'Você caiu na minha armadilha.', 'FUS RO… espera, ainda não acabou.'],
  mestreGanha: ['MISSION FAILED. Tenta de novo.', 'VOCÊ MORREU (no jogo da velha, pelo menos).', 'A causalidade estava do meu lado.', '* Você não está cheio de determinação. Está cheio de Os.'],
  jogadorGanha: ['FUS RO DAH! Você me derrubou.', 'MISSION PASSED! +RESPECT', 'O colosso caiu. E o colosso era eu.', 'BONFIRE LIT. Bem jogado.'],
  empate: ['Empate. Nem o Alduin resolveria isso.', 'Velha! Como sempre.', 'Ninguém ganhou. A Temmie ficou confusa.'],
};
const NIVEIS_VELHA = {
  aprendiz: { nome: 'Aprendiz', desc: 'Ganha quando pode, mas às vezes se distrai.' },
  cavaleiro: { nome: 'Cavaleiro', desc: 'Ganha, bloqueia e prefere o centro. Dá para vencer com armadilha dupla.' },
  mestre: { nome: 'Mestre da Dungeon', desc: 'Joga perfeito. O melhor resultado possível é empate.' },
};
let velha = null;
function sorteia(lista) { return lista[randInt(lista.length)]; }
const LINHAS_VELHA = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function vencedorVelha(t) {
  for (const [a, b, c] of LINHAS_VELHA) if (t[a] && t[a] === t[b] && t[a] === t[c]) return t[a];
  return t.every(x => x) ? 'empate' : null;
}
function jogadaQueFecha(t, quem) {
  for (const [a, b, c] of LINHAS_VELHA) {
    const l = [t[a], t[b], t[c]];
    if (l.filter(x => x === quem).length === 2 && l.includes('')) return [a, b, c][l.indexOf('')];
  }
  return -1;
}
function contaAmeacas(t, quem) { let n = 0; for (const [a, b, c] of LINHAS_VELHA) { const l = [t[a], t[b], t[c]]; if (l.filter(x => x === quem).length === 2 && l.includes('')) n++; } return n; }
const MEMO_VELHA = new Map();
function minimax(t, vez, prof = 0) {
  const chave = t.join(',') + vez + prof;
  if (MEMO_VELHA.has(chave)) return MEMO_VELHA.get(chave);
  const r = minimaxCalc(t, vez, prof);
  MEMO_VELHA.set(chave, r);
  return r;
}
function minimaxCalc(t, vez, prof) {
  const w = vencedorVelha(t);
  if (w === '⭕') return { s: 10 - prof }; if (w === '❌') return { s: prof - 10 }; if (w === 'empate') return { s: 0 };
  let melhor = { s: vez === '⭕' ? -99 : 99, i: -1 };
  for (let i = 0; i < 9; i++) {
    if (t[i]) continue;
    t[i] = vez;
    const r = minimax(t, vez === '⭕' ? '❌' : '⭕', prof + 1);
    t[i] = '';
    if ((vez === '⭕' && r.s > melhor.s) || (vez === '❌' && r.s < melhor.s)) melhor = { s: r.s, i };
  }
  return melhor;
}
function jogadaMestre(t, nivel) {
  const livres = t.map((x, k) => x ? -1 : k).filter(k => k >= 0);
  const ganhar = jogadaQueFecha(t, '⭕'), bloquear = jogadaQueFecha(t, '❌');
  if (nivel === 'aprendiz') {
    if (ganhar >= 0 && randInt(100) < 80) return { i: ganhar };
    if (bloquear >= 0 && randInt(100) < 50) return { i: bloquear, fala: 'bloqueio' };
    return { i: livres[randInt(livres.length)] };
  }
  if (nivel === 'cavaleiro') {
    if (ganhar >= 0) return { i: ganhar };
    if (bloquear >= 0) return { i: bloquear, fala: 'bloqueio' };
    for (const i of livres) { const c = t.slice(); c[i] = '⭕'; if (contaAmeacas(c, '⭕') >= 2) return { i, fala: 'armadilha' }; }
    if (!t[4]) return { i: 4 };
    const cantos = [0, 2, 6, 8].filter(k => !t[k]);
    if (cantos.length && randInt(100) < 70) return { i: cantos[randInt(cantos.length)] };
    return { i: livres[randInt(livres.length)] };
  }
  // mestre: perfeito, mas entre jogadas igualmente boas escolhe ao acaso (não fica repetitivo)
  if (bloquear >= 0 && ganhar < 0) return { i: bloquear, fala: 'bloqueio' };
  let melhor = -99, opcoes = [];
  for (const i of livres) {
    const c = t.slice(); c[i] = '⭕';
    const s = minimax(c, '❌', 1).s;
    if (s > melhor) { melhor = s; opcoes = [i]; } else if (s === melhor) opcoes.push(i);
  }
  const i = opcoes[randInt(opcoes.length)];
  const c = t.slice(); c[i] = '⭕';
  return { i, fala: contaAmeacas(c, '⭕') >= 2 ? 'armadilha' : null };
}
function novaPartidaVelha() {
  velha.t = Array(9).fill(''); velha.fim = false; velha.fala = sorteia(FALAS_MESTRE.inicio);
  velha.comeca = velha.comeca === '❌' ? '⭕' : '❌';
  if (velha.comeca === '⭕') { const j = jogadaMestre(velha.t, velha.nivel); velha.t[j.i] = '⭕'; velha.fala = 'Eu começo desta vez. ' + velha.fala; }
}
function bonusVelha() {
  if (!velha) { velha = { nivel: 'cavaleiro', placar: { v: 0, d: 0, e: 0 }, comeca: '⭕' }; novaPartidaVelha(); }
  const c = $('#bonus-corpo');
  c.innerHTML = `<div class="row" style="margin-bottom:10px"><span class="small">Nível do Mestre:</span>
      ${Object.entries(NIVEIS_VELHA).map(([k, n]) => `<button class="btn mini ${velha.nivel === k ? 'pri' : ''}" data-nivel="${k}" title="${escHtml(n.desc)}">${escHtml(n.nome)}</button>`).join('')}</div>
    <p class="small muted">${escHtml(NIVEIS_VELHA[velha.nivel].desc)}</p>
    <p><b>Mestre da Dungeon:</b> ${escHtml(velha.fala)}</p>
    <div class="velha" role="grid" aria-label="Tabuleiro">${velha.t.map((x, i) => `<button data-v="${i}" aria-label="casa ${i + 1}${x ? ': ' + (x === '❌' ? 'X' : 'O') : ''}" ${x || velha.fim ? 'disabled' : ''}>${x}</button>`).join('')}</div>
    <p class="muted">Você é ❌. Vitórias ${velha.placar.v} · Derrotas ${velha.placar.d} · Empates ${velha.placar.e}</p>
    <button class="btn" id="v-novo">↻ Nova partida</button>`;
  $$('[data-v]', c).forEach(b => b.onclick = () => jogarVelha(Number(b.dataset.v)));
  $$('[data-nivel]', c).forEach(b => b.onclick = () => { velha.nivel = b.dataset.nivel; velha.placar = { v: 0, d: 0, e: 0 }; novaPartidaVelha(); bonusVelha(); });

const DIRECOES = [[0, 1], [1, 0], [1, 1]];
function gerarCaca(palavras, n) {
  for (let tentativa = 0; tentativa < 60; tentativa++) {
    const g = Array.from({ length: n }, () => Array(n).fill(''));
    const postas = [];
    let ok = true;
    for (const p of palavras.slice().sort((a, b) => b.length - a.length)) {
      let posta = false;
      for (let k = 0; k < 300 && !posta; k++) {
        const [dl, dc] = DIRECOES[randInt(DIRECOES.length)];
        const l0 = randInt(n - dl * (p.length - 1)), c0 = randInt(n - dc * (p.length - 1));
        let cabe = true;
        for (let i = 0; i < p.length; i++) { const v = g[l0 + dl * i][c0 + dc * i]; if (v && v !== p[i]) { cabe = false; break; } }
        if (!cabe) continue;
        for (let i = 0; i < p.length; i++) g[l0 + dl * i][c0 + dc * i] = p[i];
        postas.push({ p, l0, c0, dl, dc });
        posta = true;
      }
      if (!posta) { ok = false; break; }
    }
    if (!ok) continue;
    const ABC = 'ABCDEFGHIJLMNOPQRSTUVXZ';
    for (let l = 0; l < n; l++) for (let c = 0; c < n; c++) if (!g[l][c]) g[l][c] = ABC[randInt(ABC.length)];
    return { g, postas };
  }
  return null;
}

function parseTabela(txt) {
  const linhas = txt.split(/\r?\n/).filter(l => l.trim());
  if (!linhas.length) return [];
  const sep = linhas[0].includes('\t') ? '\t' : (linhas[0].split(';').length > linhas[0].split(',').length ? ';' : ',');
  const split = (l) => {
    if (sep === '\t') return l.split('\t');
    const out = []; let cur = '', q = false;
    for (const ch of l) {
      if (ch === '"') q = !q;
      else if (ch === sep && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  };
  const cab = split(linhas[0]).map(normTxt);
  const idx = (pred) => cab.findIndex(pred);
  const iNome = idx(h => h.includes('nome'));
  const iNum = idx(h => h.startsWith('n') && (h.includes('numero') || h === 'n' || h === 'no' || h.includes('chamada') || h === 'num'));
  const iTurma = idx(h => h.includes('turma'));
  const iEscola = idx(h => h.includes('escola') || h.includes('colegio') || h.includes('instituicao'));
  const iCod = idx(h => h.includes('codigo') || h.includes('conferencia'));
  if ([iNome, iNum, iEscola, iTurma, iCod].some(i => i < 0)) return { erro: 'Não achei as colunas. O cabeçalho precisa ter: Nome, Número, Colégio, Turma e Código.' };
  return linhas.slice(1).map(l => { const c = split(l); const esc = escolaPorTexto(c[iEscola]); return { nome: (c[iNome] || '').trim(), numero: (c[iNum] || '').trim(), escola: esc ? esc.sigla : (c[iEscola] || '').trim(), escolaOk: !!esc, turma: (c[iTurma] || '').trim(), codigo: (c[iCod] || '').trim() }; });
}
