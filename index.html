<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dungeon do Python II</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8'%3E%3Cpath fill='%23e8212b' d='M1 1h2v1h1v1h1V2h1V1h2v3H7v1H6v1H5v1H4V6H3V5H2V4H1z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #15121c; --bg2: #1f1a2a; --card: #241e31; --line: #3b3150; --txt: #ece6f5; --muted: #a79bbd;
  --acc: #f0b429; --acc2: #7cc4ff; --ok: #5bd17a; --bad: #ff5c6c; --code-bg: #0e0c13;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --head: "Trebuchet MS", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Consolas, "Courier New", monospace;
  --ind: 30px; --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 16px; line-height: 1.45;
  min-height: 100vh; transition: background .4s;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
input, select, textarea { font: inherit; }
a { color: var(--acc2); }
#app { max-width: 1180px; margin: 0 auto; padding: 12px 16px 70px; }
h1, h2, h3 { font-family: var(--head); margin: .3em 0; line-height: 1.15; }
.muted { color: var(--muted); }
.small { font-size: .85em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; }
.btn {
  background: var(--bg2); color: var(--txt); border: 2px solid var(--line); border-radius: 8px; padding: 9px 14px;
  font-weight: 600; transition: transform .08s, border-color .2s; touch-action: manipulation;
}
.btn:hover:not(:disabled) { border-color: var(--acc); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.pri { background: var(--acc); color: #1b1300; border-color: var(--acc); }
.btn.grande { font-size: 1.15em; padding: 13px 22px; }
.btn.perigo { border-color: var(--bad); color: var(--bad); }
.btn.mini { padding: 4px 9px; font-size: .85em; }
.cta { animation: pulso 1.6s infinite; }
@keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(240,180,41,.55); } 50% { box-shadow: 0 0 0 8px rgba(240,180,41,0); } }
.campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.campo input, .campo select, textarea {
  background: var(--code-bg); color: var(--txt); border: 2px solid var(--line); border-radius: 8px; padding: 10px;
}
footer#rodape {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 6px 14px; font-size: .78em; color: var(--muted); background: rgba(0,0,0,.35); backdrop-filter: blur(4px); z-index: 20;
}
footer#rodape button { background: none; border: none; color: var(--muted); padding: 4px 8px; }

/* ---------- topo do desafio ---------- */
.hud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 0 12px; }
.hud .titulo-andar { font-family: var(--head); font-weight: 700; font-size: 1.05em; }
.coracoes { display: flex; gap: 4px; }
.coracao { width: 30px; height: 27px; image-rendering: pixelated; }
.coracao.quebrou { animation: quebra .6s; }
@keyframes quebra { 0% { transform: scale(1.4) rotate(-10deg); } 40% { transform: scale(.7) rotate(10deg); } 100% { transform: none; } }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--line); font-size: .85em; }

/* ---------- área de desafio ---------- */
.enunciado { margin-bottom: 12px; }
.enunciado .historia { font-style: italic; color: var(--muted); margin: 0 0 6px; }
.enunciado .tarefa { font-weight: 600; margin: 0; }
.bancada { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.bancada > div { min-width: 0; }
@media (min-width: 900px) { .bancada { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } .bancada .col-prog { order: 2; } .bancada .col-pecas { order: 1; } }
.painel-titulo { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 6px; font-family: var(--head); }
.pool, .area {
  background: var(--code-bg); border: 2px dashed var(--line); border-radius: var(--radius); padding: 10px; min-height: 120px;
  display: flex; flex-direction: column; gap: 6px; position: relative;
}
.area { border-style: solid; padding-left: 10px; padding-top: 28px;
  background-image:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.18) 0 4px, transparent 4px 9px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,.18) 0 4px, transparent 4px 9px);
  background-size: 2px 100%, 2px 100%;
  background-position: calc(10px + var(--ind) - 6px) 0, calc(10px + 2 * var(--ind) - 6px) 0;
  background-repeat: no-repeat;
}
.trilhos { position: absolute; top: 6px; left: 10px; right: 10px; display: flex; font-size: .7em; color: var(--muted); font-family: var(--mono); pointer-events: none; }
.trilhos span { width: var(--ind); white-space: nowrap; }
.vazio { color: var(--muted); font-size: .9em; text-align: center; padding: 18px 6px; pointer-events: none; }
.bloco {
  min-width: 0; display: flex; align-items: stretch; gap: 0; background: #1d2433; border: 2px solid #34405a; border-radius: 7px;
  font-family: var(--mono); font-size: .92em; color: #e8eefc; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: margin-left .15s, box-shadow .15s; min-height: 38px;
}
.bloco .alca { display: flex; align-items: center; padding: 0 8px; color: #8796b8; cursor: grab; touch-action: none; border-right: 1px solid #34405a; font-size: 1.1em; }
.bloco .cod { padding: 8px 10px; white-space: pre; overflow-x: auto; flex: 1; cursor: pointer; align-self: center; }
.pool .bloco:hover { border-color: var(--acc); }
.bloco .ctrl { display: flex; align-items: center; gap: 2px; padding: 0 4px; border-left: 1px solid #34405a; }
.bloco .ctrl button { background: none; border: none; color: #c5d0ea; padding: 6px 7px; font-size: .95em; border-radius: 5px; min-width: 30px; }
.bloco .ctrl button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
.bloco.arrastando { opacity: .35; }
.bloco.fantasma { position: fixed; z-index: 1000; pointer-events: none; opacity: .92; box-shadow: 0 10px 25px rgba(0,0,0,.5); }
.bloco.travado .ctrl .ind { visibility: hidden; }
.marca-drop { height: 4px; background: var(--acc); border-radius: 2px; margin: -3px 0; }
.lv1 { margin-left: var(--ind); } .lv2 { margin-left: calc(2 * var(--ind)); }
.kw { color: #ff8fd2; } .st { color: #9be89b; } .nu { color: #ffcf70; } .fn { color: #8fd3ff; } .cm { color: #7d8597; }
@media (max-width: 600px) {
  :root { --ind: 22px; }
  .bloco { font-size: .82em; }
  .bloco .cod { white-space: pre-wrap; word-break: break-word; padding: 7px 8px; }
  .area .bloco { flex-wrap: wrap; }
  .area .bloco .cod { flex: 1 1 calc(100% - 40px); }
  .area .bloco .ctrl { flex: 1 0 100%; justify-content: flex-end; border-left: none; border-top: 1px solid #34405a; padding: 0 2px; }
  .area .bloco .ctrl button { padding: 3px 10px; min-width: 38px; }
  .bloco .ctrl button { padding: 6px 4px; min-width: 26px; }
}
.acoes-exec { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
.terminal {
  background: #050507; color: #d6d6d6; border: 2px solid #2a2a33; border-radius: var(--radius); padding: 12px; font-family: var(--mono);
  font-size: .9em; white-space: pre-wrap; word-break: break-word; min-height: 90px; max-height: 360px; overflow: auto;
}
.terminal .in { color: #7dff9b; }
.terminal .err { color: #ff7b85; }
.terminal .info { color: #8fc7ff; }
.terminal .okk { color: #7dff9b; font-weight: 700; }
.terminal .tit { color: #aaa; }

/* ---------- mapa ---------- */
.grade-andares { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.andar-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 180px; }
.andar-card .num { font-size: .8em; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.andar-card h3 { margin: 0; }
.andar-card .estrelas { font-size: 1.4em; letter-spacing: 2px; color: var(--acc); }
.andar-card.bloqueado { opacity: .55; }
.andar-card .faixa { position: absolute; top: 0; left: 0; right: 0; height: 6px; }
.estrela-vazia { color: #4a405c; }

/* ---------- modal / overlays ---------- */
.modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
.modal { background: var(--card); color: var(--txt); border: 2px solid var(--line); border-radius: 14px; padding: 18px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
.modal h2 { margin-top: 0; }
.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #000c; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 900; max-width: 90vw; text-align: center; }
#badge-print { position: fixed; top: 10px; right: 10px; z-index: 950; background: #0b5; color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 700; display: none; }

.foco-fundo { position: fixed; inset: 0; z-index: 980; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.foco-fundo.susto { background: #a0000f; animation: pisca .35s steps(2) infinite; }
@keyframes pisca { 50% { background: #300; } }
.foco-fundo.alivio { background: rgba(10,10,20,.94); }
.foco-caixa { max-width: 620px; }
.foco-caixa h1 { font-size: clamp(1.8em, 6vw, 3.2em); margin: 0 0 10px; }

.morte { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 990; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: escurece 2.5s forwards; }
@keyframes escurece { to { background: rgba(0,0,0,.92); } }
.morte .faixa { width: 100%; background: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); padding: 28px 10px; text-align: center; opacity: 0; animation: surge 2s .6s forwards; }
.morte .faixa h1 { font-family: "Times New Roman", Georgia, serif; font-weight: 400; color: #a3121c; font-size: clamp(2.6em, 11vw, 6em); letter-spacing: .12em; margin: 0; }
@keyframes surge { to { opacity: 1; } }
.morte .sub { color: #ccc; margin-top: 18px; opacity: 0; animation: surge 1s 2.4s forwards; text-align: center; padding: 0 16px; }

.banner-vitoria { text-align: center; padding: 26px 10px; }
.banner-vitoria h1 { font-size: clamp(2em, 8vw, 4em); margin: 0; }
.tremer { animation: tremer .5s 3; }
@keyframes tremer { 25% { transform: translate(-6px, 3px); } 50% { transform: translate(5px, -4px); } 75% { transform: translate(-3px, -2px); } }

/* D20 */
.d20 { width: 150px; height: 150px; display: block; margin: 0 auto; }
.d20.rolando { animation: gira .25s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.d20 text { font-family: var(--head); font-weight: 800; }

/* loja */
.itens { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.item { display: flex; flex-direction: column; gap: 6px; }
.item .ico { font-size: 2em; }

/* professor */
.abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.abas .btn.ativa { border-color: var(--acc); color: var(--acc); }
pre.codigo { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: .85em; margin: 6px 0; white-space: pre; }
table.tab { width: 100%; border-collapse: collapse; font-size: .88em; }
table.tab th, table.tab td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
.zona-drop { border: 2px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; color: var(--muted); }
.zona-drop.sobre { border-color: var(--acc); color: var(--acc); }

/* bônus */
.pixel-grade { display: grid; grid-template-columns: repeat(16, 1fr); width: min(92vw, 420px); aspect-ratio: 1; border: 2px solid var(--line); touch-action: none; background: #fff; }
.pixel-grade div { border: 1px solid rgba(0,0,0,.06); }
.paleta { display: flex; flex-wrap: wrap; gap: 4px; max-width: 420px; }
.paleta button { width: 30px; height: 30px; border: 2px solid #0006; border-radius: 6px; }
.paleta button.sel { outline: 3px solid var(--acc); }
.velha { display: grid; grid-template-columns: repeat(3, 90px); gap: 6px; }
.velha button { width: 90px; height: 90px; font-size: 2.4em; background: var(--bg2); color: var(--txt); border: 2px solid var(--line); border-radius: 10px; }

/* ================= TEMAS ================= */
body[data-tema="t1"] { --bg: #000; --bg2: #000; --card: #000; --line: #fff; --txt: #fff; --muted: #bdbdbd; --acc: #ffd400; --head: "Courier New", var(--mono); --font: "Courier New", var(--mono); --radius: 0; }
body[data-tema="t1"] .card, body[data-tema="t1"] .btn { border-width: 4px; border-radius: 0; }
body[data-tema="t1"] .btn.pri { background: #000; color: #ffd400; border-color: #ffd400; }
body[data-tema="t1"] h1, body[data-tema="t1"] h2 { text-transform: uppercase; letter-spacing: .06em; }

body[data-tema="t2"] { --bg: #1b1d1f; --bg2: #26292b; --card: #2b2e30; --line: #8a7650; --txt: #ece3cf; --muted: #b8ab8f; --acc: #d9b56a;
  --head: "Trajan Pro", "Palatino Linotype", "Book Antiqua", Georgia, serif; --font: Georgia, "Times New Roman", serif;
  background-image: radial-gradient(ellipse at top, #34383b 0%, #1b1d1f 60%); }
body[data-tema="t2"] .card { box-shadow: inset 0 0 0 1px #00000088, 0 0 0 1px #00000088; }
body[data-tema="t2"] .runas { letter-spacing: .5em; color: #8a7650; text-align: center; font-size: 1.1em; }

body[data-tema="t3"] { --bg: #1a0f2e; --bg2: #2a1745; --card: rgba(20,10,35,.86); --line: #ff9d3d; --txt: #fff; --muted: #f6c9a8; --acc: #78ff6a;
  --head: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif; background: linear-gradient(170deg, #ff7a18 0%, #b31f6b 35%, #2b1055 70%, #12082a 100%) fixed; }
body[data-tema="t3"] h1, body[data-tema="t3"] h2, body[data-tema="t3"] h3 { text-shadow: 3px 3px 0 #000; letter-spacing: .02em; }
body[data-tema="t3"] .btn.pri { color: #000; }
.procurado { color: #fff; letter-spacing: 2px; font-size: 1.15em; text-shadow: 2px 2px 0 #000; }
.procurado .on { color: #ffd400; }

body[data-tema="t4"] { --bg: #c9cfd2; --bg2: #e3e6e7; --card: rgba(245,246,246,.82); --line: #8a9399; --txt: #2c3236; --muted: #5d676d; --acc: #3e8e41; --code-bg: #1d2226;
  --head: "Palatino Linotype", "Book Antiqua", Georgia, serif; background: linear-gradient(180deg, #e9ecec 0%, #b9c2c6 55%, #8f9a9f 100%) fixed; }
body[data-tema="t4"] .btn { background: #f3f4f4; }
body[data-tema="t4"] .btn.pri { background: #3e8e41; color: #fff; border-color: #2d6b30; }
body[data-tema="t4"] h1, body[data-tema="t4"] h2 { font-weight: 400; letter-spacing: .14em; }
.anel { width: 34px; height: 34px; }

body[data-tema="t5"] { --bg: #120d0a; --bg2: #21170f; --card: #1c1510; --line: #6b3a1e; --txt: #f2e2cc; --muted: #c4a988; --acc: #ff8a2a;
  --head: "Times New Roman", Georgia, serif; background: radial-gradient(ellipse at bottom, #4a1d07 0%, #120d0a 60%) fixed; }
body[data-tema="t5"] .card { border-image: repeating-linear-gradient(45deg, #8b1a1a 0 6px, #5a0f0f 6px 12px) 4; border-width: 4px; }
body[data-tema="t5"] .btn.pri { background: #c0392b; border-color: #e74c3c; color: #fff; }

body[data-tema="t6"] { --bg: #170506; --bg2: #2a0a0c; --card: rgba(25,6,8,.9); --line: #7d1d22; --txt: #f3e6e6; --muted: #c99a9d; --acc: #e0313c;
  --head: Georgia, "Times New Roman", serif; background: linear-gradient(180deg, #5e0a0f 0%, #2a0507 35%, #170506 100%) fixed; }
body[data-tema="t6"]::before { content: ""; position: fixed; top: 14px; right: 18px; width: 84px; height: 84px; border-radius: 50%; background: #000;
  box-shadow: 0 0 0 3px #ffd9c9, 0 0 26px 10px #ff4b2b, 0 0 90px 40px rgba(142,13,18,.55); pointer-events: none; z-index: 0; }
body[data-tema="t6"] #app { position: relative; z-index: 1; }
body[data-tema="t6"] .btn.pri { background: #8e0d12; border-color: #e0313c; color: #fff; }
body[data-tema="t6"] h1, body[data-tema="t6"] h2 { letter-spacing: .08em; }

body[data-tema="t7"] { --bg: #0b1020; --bg2: #141b33; --card: #161f3b; --line: #3550a0; --acc: #4ff0ff; --head: var(--mono); }

</style>

// ===================== MOTOR DE AVALIAÇÃO DOS DESAFIOS =====================
function blocoCodigo(d, bid) {
  const tipo = bid[0], i = Number(bid.slice(1));
  return tipo === 'c' ? d.blocos[i][0] : d.distratores[i][0];
}
function buildSource(d, area) {
  return area.map(b => '    '.repeat(b.l) + blocoCodigo(d, b.bid)).join('\n') + '\n';
}
function gabaritoArea(d) {
  return d.blocos.map((b, i) => ({ bid: 'c' + i, l: b[1] }));
}
function optsTeste(t) {
  return { inputs: t.in, rand: t.rand || [], hoje: t.hoje === undefined ? '2026-10-26' : t.hoje, maxSteps: 50000 };
}
function rodarTeste(src, t) {
  return runPython(src, optsTeste(t));
}
function normOut(s) { return s.split('\n').map(x => x.replace(/\s+$/, '')).join('\n').replace(/\n+$/, ''); }

// status: 'incompleto' (não perde vida) | 'ok' | 'falhou'
function avaliar(d, area) {
  const total = d.blocos.length;
  if (area.length < total) return { status: 'incompleto', faltam: total - area.length };
  const src = buildSource(d, area);
  const gab = buildSource(d, gabaritoArea(d));
  const res = { status: 'ok', testes: [], src };
  for (let i = 0; i < d.testes.length; i++) {
    const t = d.testes[i];
    const r = rodarTeste(src, t);
    const e = rodarTeste(gab, t);
    const item = { run: r, esperado: e };
    if (r.error) { item.ok = false; item.motivo = 'erro'; }
    else if (normOut(r.stdout) !== normOut(e.stdout)) { item.ok = false; item.motivo = 'saida'; }
    else item.ok = true;
    res.testes.push(item);
    if (!item.ok) { res.status = 'falhou'; break; }
  }
  if (res.status === 'ok') {
    const usados = new Set(area.map(b => b.bid));
    const falta = d.blocos.some((_, i) => !usados.has('c' + i));
    if (falta) { res.status = 'falhou'; res.pecaFalsa = true; }
  }
  return res;
}

// QA de um desafio (usado pela suíte do professor e pelos testes no Node)
function qaDesafio(d) {
  const falhas = [];
  const gab = buildSource(d, gabaritoArea(d));
  const saidas = [];
  d.testes.forEach((t, i) => {
    const r = rodarTeste(gab, t);
    if (r.error) falhas.push(`gabarito deu erro no teste ${i + 1}: ${r.error.type}: ${r.error.msg}`);
    saidas.push(normOut(r.stdout));
  });
  if (new Set(saidas).size < 2) falhas.push('os 3 testes produzem a mesma saída (não pegam valor fixo)');
  d.distratores.forEach((dist, k) => {
    const area = gabaritoArea(d);
    area[dist[1]] = { bid: 'd' + k, l: d.blocos[dist[1]][1] };
    const res = avaliar(d, area);
    if (res.status === 'ok') falhas.push(`distrator ${k + 1} passa no lugar do bloco ${dist[1] + 1}: ${dist[0]}`);
  });
  const ok = avaliar(d, gabaritoArea(d));
  if (ok.status !== 'ok') falhas.push('o próprio gabarito não passa na avaliação');
  if (d.testes.length !== 3) falhas.push('não tem 3 testes');
  return { id: d.id, ok: falhas.length === 0, falhas };
}

    criado: Date.now(), seq: 0, andares: {}, tentativas: {}, moedas: 0, moedasGanhas: 0, bossPago: {}, inv: {},

  };
}
function gravar(save) {

  save.versao = APP_VERSION;
  const pacote = JSON.stringify({ d: save, s: assinar(save) });

// retorna { save, adulterado }
function carregarPerfil(id) {
  const raw = store.get(perfilKey(id));
  if (!raw) return { save: null, adulterado: false };
  let obj;
  try { obj = JSON.parse(raw); } catch (e) { obj = null; }
  if (!obj || !obj.d) {
    const s = novoSave(id); s.hack = 1;
    return { save: s, adulterado: true };
  }
  if (assinar(obj.d) !== obj.s) {
    const s = obj.d;
    s.moedas = 0; s.inv = {}; s.hack = (Number(s.hack) || 0) + 1;
    return { save: s, adulterado: true };
  }
  return { save: obj.d, adulterado: false };
}

// ---------- pontuação ----------
function totalEstrelas(save) {
  let t = 0;
  for (let n = 1; n <= 6; n++) t += (save.andares[n] && save.andares[n].estrelas) || 0;
  return t;
}
function nota10(save) {
  return Math.round((100 * totalEstrelas(save)) / 18);
}
function notaTexto(save) {
  const n = nota10(save);
  return (n / 10).toFixed(1).replace('.', ',');
}

// ---------- código de conferência (Crockford Base32) ----------
function empacotar(save, quando) {
  const est = [];
  for (let n = 1; n <= 6; n++) est.push((save.andares[n] && save.andares[n].estrelas) || 0);
  const minutos = Math.max(0, Math.min((1 << 24) - 1, Math.floor((quando || Date.now()) / 60000 - EPOCH_MIN)));
  const campos = [
    [1, 3], [nota10(save), 7],
    ...est.map(e => [e, 2]),
    [totalEstrelas(save) === 18 ? 1 : 0, 1],
    [Math.min(7, save.restauracoes || 0), 3],
    [save.hack ? 1 : 0, 1],
    [save.teste ? 1 : 0, 1],
    [Math.min(63, save.saidasTotal || 0), 6],
    [Math.min(7, save.moedasGanhas || 0), 3],
    [minutos, 24],
  ];
  let v = 0n;
  for (const [val, bits] of campos) v = (v << BigInt(bits)) | BigInt(val);
  return v;
}
function desempacotar(v) {
  const larguras = [3, 7, 2, 2, 2, 2, 2, 2, 1, 3, 1, 1, 6, 3, 24];
  const total = larguras.reduce((a, b) => a + b, 0);
  const vals = [];
  let shift = BigInt(total);
  for (const w of larguras) { shift -= BigInt(w); vals.push(Number((v >> shift) & ((1n << BigInt(w)) - 1n))); }
  const [fmt, nota, e1, e2, e3, e4, e5, e6, bonus, rest, hack, teste, saidas, moedas, minutos] = vals;
  return { fmt, nota10: nota, estrelas: [e1, e2, e3, e4, e5, e6], bonus, restauracoes: rest, hack, teste, saidas, moedas, quando: new Date((minutos + EPOCH_MIN) * 60000) };
}
function checksum(id, payload) {
  const base = normTxt(id.nome) + '|' + String(id.numero).trim() + '|' + normTxt(id.turma) + '|' + payload + '|' + SALT;
  return b32Encode(BigInt(cyrb53(base)) % (32n ** 5n), 5);
}
function codigoConferencia(save, quando) {
  const payload = b32Encode(empacotar(save, quando), 13);
  const cs = checksum(save.id, payload);
  return payload.slice(0, 4) + '-' + payload.slice(4, 8) + '-' + payload.slice(8) + '-' + cs;
}
// valida um código digitado (tolerante a O/0, I/L/1, espaços e hífens)
function validarCodigo(codigo, id) {
  const c = b32Normalize(codigo);
  if (c.length !== 18) return { ok: false, motivo: 'CÓDIGO INVÁLIDO (tamanho)' };
  const payload = c.slice(0, 13), cs = c.slice(13);
  const v = b32Decode(payload);
  if (v === null || b32Decode(cs) === null) return { ok: false, motivo: 'CÓDIGO INVÁLIDO (caracteres)' };
  const dados = desempacotar(v);
  if (dados.fmt !== 1) return { ok: false, motivo: 'CÓDIGO INVÁLIDO (formato)' };
  if (checksum(id, payload) !== cs) return { ok: false, motivo: 'NÃO CONFERE com nome/número/turma', dados };
  return { ok: true, dados };
}

// ---------- PNG com chunk tEXt ----------
function pngInserirTexto(bytes, chave, texto) {
  const kb = new TextEncoder().encode(chave);
  const tb = new Uint8Array(texto.length);
  for (let i = 0; i < texto.length; i++) tb[i] = texto.charCodeAt(i) & 0xff;
  const dados = new Uint8Array(kb.length + 1 + tb.length);
  dados.set(kb, 0); dados[kb.length] = 0; dados.set(tb, kb.length + 1);
  const tipo = new Uint8Array([0x74, 0x45, 0x58, 0x74]);
  const crcIn = new Uint8Array(4 + dados.length); crcIn.set(tipo, 0); crcIn.set(dados, 4);
  const crc = crc32(crcIn);
  const chunk = new Uint8Array(12 + dados.length);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, dados.length); chunk.set(tipo, 4); chunk.set(dados, 8); dv.setUint32(8 + dados.length, crc);
  // insere antes do IEND
  let pos = 8;
  const bdv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  while (pos < bytes.length) {
    const len = bdv.getUint32(pos);
    const t = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
    if (t === 'IEND') break;
    pos += 12 + len;
  }
  const out = new Uint8Array(bytes.length + chunk.length);
  out.set(bytes.subarray(0, pos), 0); out.set(chunk, pos); out.set(bytes.subarray(pos), pos + chunk.length);
  return out;
}
function pngLerTexto(bytes, chave) {
  const assin = [137, 80, 78, 71, 13, 10, 26, 10];
  for (let i = 0; i < 8; i++) if (bytes[i] !== assin[i]) return { erro: 'não é um arquivo PNG' };
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let pos = 8;
  while (pos + 12 <= bytes.length) {
    const len = dv.getUint32(pos);
    const t = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
    if (t === 'tEXt') {
      const dados = bytes.subarray(pos + 8, pos + 8 + len);
      const crcCalc = crc32(bytes.subarray(pos + 4, pos + 8 + len));
      const crcArq = dv.getUint32(pos + 8 + len);
      const z = dados.indexOf(0);
      const k = new TextDecoder().decode(dados.subarray(0, z));
      if (k === chave) {
        if (crcCalc !== crcArq) return { erro: 'o bloco de dados do PNG está corrompido (CRC)' };
        let s = '';
        for (let i = z + 1; i < dados.length; i++) s += String.fromCharCode(dados[i]);
        return { texto: s };
      }
    }
    if (t === 'IEND') break;
    pos += 12 + len;
  }
  return { erro: 'esse PNG não tem dados do jogo (foi recomprimido, é um print de tela ou é outra imagem)' };
}
function pacotePNG(save, checkpoint) {
  const copia = JSON.parse(JSON.stringify(save));
  if (!checkpoint) copia.run = null;
  return 'DPY2|' + encodeURIComponent(JSON.stringify({ v: APP_VERSION, cp: !!checkpoint, d: copia, s: assinar(copia) }));
}
function lerPacotePNG(texto) {
  if (!texto.startsWith('DPY2|')) return { erro: 'formato desconhecido' };
  let obj;
  try { obj = JSON.parse(decodeURIComponent(texto.slice(5))); } catch (e) { return { erro: 'dados ilegíveis' }; }
  if (!obj.d || obj.d.fmt !== SAVE_FMT) return { erro: `placar de uma versão incompatível (${obj.v || '?'})` };
  const valido = assinar(obj.d) === obj.s;
  return { save: obj.d, valido, checkpoint: !!obj.cp, versao: obj.v };
}

// ---------- ÁUDIO (Web Audio, sons originais) ----------
const Som = (() => {
  let ctx = null, mudo = store.get('mudo') === '1';
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tom(freq, dur, tipo = 'square', vol = 0.12, quando = 0, freqFim = null) {
    if (mudo) return;
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + quando;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(freq, t0);
    if (freqFim) o.frequency.exponentialRampToValueAtTime(freqFim, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function ruido(dur, vol = 0.15, quando = 0, corte = 1200) {
    if (mudo) return;
    const c = ac(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = corte;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(c.currentTime + quando);
  }
  const seq = (notas, tipo, vol, passo) => notas.forEach((f, i) => f && tom(f, passo * 0.95, tipo, vol, i * passo));
  const sons = {
    clique: () => tom(660, 0.05, 'square', 0.05),
    encaixe: () => { tom(440, 0.05, 'triangle', 0.08); tom(660, 0.06, 'triangle', 0.08, 0.04); },
    erro: () => { tom(196, 0.18, 'sawtooth', 0.1); tom(147, 0.25, 'sawtooth', 0.1, 0.12); },
    acerto: () => seq([523, 659, 784, 1047], 'square', 0.08, 0.08),
    coracao: () => { tom(880, 0.06, 'square', 0.1); tom(220, 0.3, 'square', 0.1, 0.06, 110); },
    moeda: () => { tom(988, 0.07, 'square', 0.08); tom(1319, 0.25, 'square', 0.08, 0.07); },
    dado: () => { for (let i = 0; i < 9; i++) tom(300 + Math.random() * 500, 0.03, 'square', 0.04, i * 0.11); },
    critico: () => seq([784, 988, 1175, 1568, 1976], 'square', 0.09, 0.06),
    alarme: () => { for (let i = 0; i < 8; i++) { tom(960, 0.22, 'sawtooth', 0.09, i * 0.5); tom(640, 0.22, 'sawtooth', 0.09, i * 0.5 + 0.25); } },
    morte: () => { tom(82, 2.2, 'sine', 0.35); tom(55, 2.8, 'sine', 0.3, 0.3); ruido(1.5, 0.06, 0.1, 300); },
    vitoria1: () => seq([392, 523, 659, 784, 0, 659, 784], 'square', 0.07, 0.11),
    vitoria2: () => { ruido(0.25, 0.25, 0, 900); tom(110, 0.3, 'sawtooth', 0.15, 0.05); ruido(0.3, 0.25, 0.4, 700); tom(98, 0.35, 'sawtooth', 0.15, 0.45); ruido(0.7, 0.35, 0.85, 500); tom(73, 0.9, 'sawtooth', 0.18, 0.9); },
    vitoria3: () => { tom(55, 0.5, 'square', 0.15); seq([0, 330, 0, 392, 440, 0, 523], 'sawtooth', 0.06, 0.12); },
    vitoria4: () => { tom(220, 2.4, 'sine', 0.08); tom(277, 2.4, 'sine', 0.06, 0.2); tom(330, 2.4, 'sine', 0.06, 0.4); tom(440, 2.0, 'sine', 0.05, 0.6); },
    vitoria5: () => { ruido(1.2, 0.08, 0, 2500); seq([262, 0, 330, 392, 0, 523], 'triangle', 0.1, 0.16); },
    vitoria6: () => { tom(65, 2, 'sawtooth', 0.1); tom(69, 2, 'sawtooth', 0.08); seq([0, 0, 392, 370, 349, 330], 'triangle', 0.08, 0.3); },
  };
  return {
    tocar(nome) { try { sons[nome] && sons[nome](); } catch (e) { } },
    nomes: Object.keys(sons),
    get mudo() { return mudo; },
    alternar() { mudo = !mudo; store.set('mudo', mudo ? '1' : '0'); return mudo; },
    destravar() { ac(); },
  };
})();

  S = r.save || novoSave(id);
  verificarSaidaPendente();
  gravar(S);
  if (r.adulterado) { julgamento(); return; }
  mostrar('mapa');
}
function julgamento() {
  setTema('t1');
  Som.tocar('erro');
  view().innerHTML = `<div class="card" style="max-width:640px;margin:40px auto;text-align:center">
    <h1>* O JULGAMENTO</h1>
    <p>* Alguém mexeu no seu save por fora do jogo.</p>
    <p>* Você sente o peso dos seus bytes nas costas.</p>

}

// ---------- MAPA ----------
function andarLiberado(n) {
  if (god()) return true;
  if (n === 1) return true;
  if (n === 7) return totalEstrelas(S) === 18;
  return !!(S.andares[n - 1]);
}
function renderMapa() {
  setTema('t0');
  const r = S.run;
  const inv = ITENS.filter(it => S.inv[it.id] > 0).map(it => `<span class="chip" title="${escHtml(it.nome)}">${it.icone} ×${S.inv[it.id]}</span>`).join(' ') || '<span class="muted small">vazia</span>';
  let cards = '';
  for (let n = 1; n <= 7; n++) {
    const A = ANDARES[n];
    const lib = andarLiberado(n);
    const feito = S.andares[n];
    const emCurso = r && r.andar === n;
    let corpo, botoes = '';
    if (n === 7) {
      corpo = `<div class="num">Andar bônus</div><h3>🔒 Sala Secreta do Desenvolvedor</h3><p class="small muted">Só abre com 18 estrelas (3 em todos os andares).</p>`;
      if (lib) botoes = `<button class="btn pri" data-acao="bonus">Entrar</button>`;
    } else {
      corpo = `<div class="faixa" style="background:${['', '#fff', '#d9b56a', '#ff7a18', '#3e8e41', '#ff8a2a', '#e0313c'][n]}"></div>
        <div class="num">Andar ${n} · ${escHtml(A.jogo)}</div><h3>${escHtml(A.nome)}</h3>
        <div class="small muted">${escHtml(A.conteudo)}</div>
        <div class="estrelas">${feito ? htmlEstrelas(feito.estrelas) : htmlEstrelas(0)}</div>`;
      if (emCurso) {
        corpo += `<div class="small">Em andamento: desafio ${r.resolvidos.length + 1}/4 ${'❤'.repeat(Math.max(0, r.vidas))} ${r.modo === 'treino' ? '(treino)' : ''}</div>`;
        botoes = `<button class="btn pri cta" data-acao="continuar">▶ Continuar</button>`;
      } else if (lib && !r) {
        botoes = `<button class="btn ${feito ? '' : 'pri cta'}" data-acao="iniciar" data-n="${n}">${feito ? '↻ Treinar' : '⚔ Entrar'}</button>`;
        if (feito && S.inv['ITEM-06'] > 0 && feito.estrelas < 3) botoes += ` <button class="btn" data-acao="ampulheta" data-n="${n}">⏳ Ampulheta</button>`;
      } else if (!lib) botoes = `<span class="muted small">🔒 Vença o andar ${n - 1}</span>`;
      else botoes = `<span class="muted small">Termine o andar em andamento primeiro.</span>`;
    }
    cards += `<div class="card andar-card ${lib ? '' : 'bloqueado'}">${corpo}<div class="spacer"></div><div class="row">${botoes}</div></div>`;
  }
  const ok = totalEstrelas(S);
  view().innerHTML = `
  <div class="row" style="align-items:flex-start">
    <div><h1 style="margin:0">🗺 Mapa da Dungeon</h1>
    <div class="muted">${escHtml(S.id.nome)} · nº ${escHtml(S.id.numero)} · ${escHtml(S.id.turma)}</div></div>
    <div class="spacer"></div>
    <div class="card" style="padding:8px 12px"><b>Nota:</b> ${notaTexto(S)} · ⭐ ${ok}/18 · 🪙 ${S.moedas}</div>
  </div>
  ${god() ? '<p class="chip" style="background:#3a0">MODO PROFESSOR ATIVO (vidas infinitas, foco livre, tudo liberado). O placar fica marcado como TESTE.</p>' : ''}
  ${S.hack ? '<p class="chip" style="background:#600">[TENTATIVA DE HACK F12] registrada</p>' : ''}
  <div class="row" style="margin-top:10px">
    <button class="btn" data-acao="loja">🛒 Loja do Mercador</button>
    <button class="btn" data-acao="placar">🏆 Baixar placar (PNG)</button>
    ${CFG.formsUrl ? `<button class="btn" data-acao="forms" ${r ? 'disabled title="Termine o andar primeiro"' : ''}>📤 Enviar no formulário</button>` : ''}
    <span class="small muted">Mochila: ${inv}</span>

// ---------- INÍCIO DE ANDAR ----------
function iniciarAndar(n, modoForcado) {
  const filaNormais = shuffle(DESAFIOS.filter(d => d.andar === n && d.dif !== 'B').map(d => d.id));
  const boss = DESAFIOS.find(d => d.andar === n && d.dif === 'B').id;
  let modo = S.andares[n] ? 'treino' : 'valendo';
  if (modoForcado) modo = modoForcado;
  if (modo === 'valendo') S.tentativas[n] = (S.tentativas[n] || 0) + 1;
  S.run = { andar: n, fila: [...filaNormais, boss], resolvidos: [], vidas: 3, perdidos: 0, combo: 0, saidas: 0, micro: [], printp: { usados: 0, ate: 0 },
    bardo: false, dados: {}, montagem: {}, modo, inicio: Date.now(), away: null, introVista: false };
  persistir();
  renderIntro();
}
function renderIntro() {
  const r = ctxRun();
  const A = ANDARES[r.andar];
  setTema(A.tema);
  view().innerHTML = `<div class="card" style="max-width:720px;margin:20px auto;text-align:center">
    ${A.tema === 't2' ? '<div class="runas">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ</div>' : ''}
    <div class="muted small" style="letter-spacing:.2em">ANDAR ${r.andar} · ${escHtml(A.jogo).toUpperCase()}</div>
    <h1 style="font-size:clamp(2em,7vw,3.2em)">${escHtml(A.nome)}</h1>

    <p class="muted">Conteúdo: ${escHtml(A.conteudo)}</p>

    ${r.modo === 'treino' ? '<p class="chip">Modo treino: esse andar já valeu nota. Agora é só para praticar.</p>' : ''}
    ${r.modo === 'ampulheta' ? '<p class="chip">⏳ Ampulheta: se fizer mais estrelas que da primeira vez, fica a maior.</p>' : ''}
    <div class="row" style="justify-content:center;margin-top:10px">

}

// ---------- DESAFIO ----------
function desafioAtual() { const r = ctxRun(); return r ? DES[r.fila[0]] : null; }
function montagemDe(r, d) {
  if (!r.montagem[d.id]) {
    const todos = [...d.blocos.map((_, i) => 'c' + i), ...d.distratores.map((_, i) => 'd' + i)];
    r.montagem[d.id] = { area: [], pool: shuffle(todos), removidos: [], ima: false };
  }
  return r.montagem[d.id];
}
function nivelCorreto(d, bid) {
  const i = Number(bid.slice(1));
  return bid[0] === 'c' ? d.blocos[i][1] : d.blocos[d.distratores[i][1]][1];
}
function renderDesafio() {
  const r = ctxRun();
  const d = desafioAtual();
  if (!r || !d) { mostrar('mapa'); return; }
  const A = ANDARES[r.andar];
  setTema(A.tema);
  const m = montagemDe(r, d);
  const di = DIF_INFO[d.dif];
  const dado = r.dados[d.id];
  const dicaLiberada = dado && dado.sucesso;
  const extraHud = A.tema === 't3'
    ? `<span class="procurado" title="Nível de procurado = corações perdidos">${[0, 1, 2, 3, 4].map(i => `<span class="${i < r.perdidos ? 'on' : ''}">★</span>`).join('')}</span>`
    : A.tema === 't4' ? `<svg class="anel" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#0003" stroke-width="5"/><circle cx="18" cy="18" r="15" fill="none" stroke="#3e8e41" stroke-width="5" stroke-dasharray="${(Math.max(0, r.vidas) / 3) * 94.2} 94.2" transform="rotate(-90 18 18)"/></svg>` : '';
  const invBtns = r.sandbox ? '' : ITENS.filter(it => it.onde === 'desafio' && S.inv[it.id] > 0)
    .map(it => `<button class="btn mini" data-acao="usar-item" data-item="${it.id}" title="${escHtml(it.efeito)}">${it.icone} ${escHtml(it.nome)} ×${S.inv[it.id]}</button>`).join('');
  view().innerHTML = `
  <div class="hud">
    <span class="titulo-andar">${r.sandbox ? '🧪 TESTE DO PROFESSOR · ' : ''}Andar ${r.andar} · ${d.dif === 'B' ? '👑 BOSS' : `Desafio ${r.resolvidos.length + 1}/4`}</span>
    ${htmlCoracoes(r)} ${extraHud}
    ${r.combo >= 2 ? `<span class="chip">🔥 Combo ×${r.combo}</span>` : ''}
    ${r.bardo ? '<span class="chip">🎲 Bardo +1d4</span>' : ''}
    <span class="chip">${di.nome} · CD ${di.cd}</span>
    <span class="chip muted">${d.id}</span>
    <div class="spacer"></div>
    <button class="btn mini" data-acao="d20">🎲 D20 por dica</button>
    ${dicaLiberada ? '<button class="btn mini" data-acao="ver-dica">📜 Dica</button>' : ''}
    ${r.sandbox ? '<button class="btn mini" data-acao="auto-montar">🪄 Auto-montar resposta</button><button class="btn mini" data-acao="sair-sandbox">✕ Voltar</button>' : '<button class="btn mini" data-acao="ir-mapa">🗺 Mapa</button>'}
  </div>
  <div class="card enunciado">
    <h2 style="margin-top:0">${escHtml(d.titulo)}</h2>
    <p class="historia">${escHtml(d.historia)}</p>
    <p class="tarefa">🎯 ${escHtml(d.tarefa)}</p>
  </div>
  ${invBtns ? `<div class="row" style="margin-bottom:10px"><span class="small muted">🎒 Usar:</span>${invBtns}</div>` : ''}
  <div class="bancada">
    <div class="col-prog">
      <div class="painel-titulo">🧩 Seu programa <span class="small muted">(${m.area.length} linha${m.area.length === 1 ? '' : 's'})</span></div>
      <div class="area" id="area" aria-label="Área de montagem">
        <div class="trilhos"><span>0</span><span>4</span><span>8 espaços</span></div>
        ${m.area.length ? m.area.map((b, i) => htmlBloco(d, b, i, 'area', m)).join('') : '<div class="vazio">Arraste as peças para cá, ou toque nelas.</div>'}
      </div>
    </div>
    <div class="col-pecas">
      <div class="painel-titulo">📦 Caixa de peças <span class="small muted">(tem peça falsa!)</span></div>
      <div class="pool" id="pool" aria-label="Caixa de peças">
        ${m.pool.filter(b => !m.removidos.includes(b)).map(b => htmlBloco(d, { bid: b, l: 0 }, -1, 'pool', m)).join('') || '<div class="vazio">Todas as peças estão no programa.</div>'}
      </div>
    </div>
  </div>
  <div class="acoes-exec">
    <button class="btn pri grande ${resultadoPendente ? '' : 'cta'}" data-acao="executar" ${resultadoPendente && resultadoPendente.bloqueia ? 'disabled' : ''}>▶ EXECUTAR PROGRAMA</button>
    <span class="small muted">Testa com 3 conjuntos de valores. Só o 1º aparece.</span>
  </div>
  <div class="terminal" id="terminal" aria-live="polite">${resultadoPendente ? resultadoPendente.html : '<span class="tit">Terminal pronto. Monte o programa e aperte EXECUTAR.</span>'}</div>
  ${resultadoPendente && resultadoPendente.botao ? `<div class="row" style="margin-top:12px;justify-content:flex-end">${resultadoPendente.botao}</div>` : ''}`;
}
function htmlBloco(d, b, i, onde, m) {
  const code = blocoCodigo(d, b.bid);
  const travado = onde === 'area' && m.ima && b.bid[0] === 'c';
  if (onde === 'pool') {
    return `<div class="bloco" data-bid="${b.bid}" data-onde="pool"><span class="alca" aria-hidden="true">⠿</span><span class="cod" data-acao="adicionar" data-bid="${b.bid}" role="button" tabindex="0" aria-label="Adicionar: ${escHtml(code)}">${realce(code)}</span></div>`;
  }
  return `<div class="bloco lv${b.l} ${travado ? 'travado' : ''}" data-bid="${b.bid}" data-onde="area" data-i="${i}">
    <span class="alca" aria-hidden="true">⠿</span><span class="cod">${realce(code)}</span>
    <span class="ctrl">
      <button data-acao="mover" data-i="${i}" data-d="-1" aria-label="Subir" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button data-acao="mover" data-i="${i}" data-d="1" aria-label="Descer" ${i === m.area.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="ind" data-acao="recuo" data-i="${i}" data-d="-1" aria-label="Menos recuo" ${b.l === 0 ? 'disabled' : ''}>←</button>
      <button class="ind" data-acao="recuo" data-i="${i}" data-d="1" aria-label="Mais recuo" ${b.l === 2 ? 'disabled' : ''}>→</button>
      <button data-acao="tirar" data-i="${i}" aria-label="Devolver para a caixa">✕</button>
    </span></div>`;
}
function mexeu() {
  if (resultadoPendente && !resultadoPendente.fixo) resultadoPendente = null;
  persistir();
  renderDesafio();
}
function adicionarBloco(bid, pos, nivel) {
  const r = ctxRun(), d = desafioAtual(), m = montagemDe(r, d);
  const pi = m.pool.indexOf(bid);
  if (pi < 0) return;
  m.pool.splice(pi, 1);
  let l = nivel;
  if (l === undefined) l = m.area.length ? m.area[m.area.length - 1].l : 0;
  if (m.ima) l = nivelCorreto(d, bid);
  const p = pos === undefined ? m.area.length : pos;
  m.area.splice(p, 0, { bid, l });
  Som.tocar('encaixe');
  mexeu();
}

// ---------- arrastar (mouse e toque, via Pointer Events) ----------
let drag = null;
function iniciarArrasto(e) {
  const bloco = e.target.closest('.bloco');
  if (!bloco || !bloco.closest('#view') || e.target.closest('button')) return;
  const viaAlca = !!e.target.closest('.alca');
  if (e.pointerType !== 'mouse' && !viaAlca) return;
  if (e.button !== undefined && e.button !== 0) return;
  const rect = bloco.getBoundingClientRect();
  drag = { el: bloco, bid: bloco.dataset.bid, onde: bloco.dataset.onde, i: Number(bloco.dataset.i), x0: e.clientX, y0: e.clientY,
    offX: e.clientX - rect.left, offY: e.clientY - rect.top, largura: rect.width, ativo: false, pid: e.pointerId };
  if (viaAlca) e.preventDefault();
}
function moverArrasto(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.ativo) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.ativo = true;
    const g = drag.el.cloneNode(true);
    g.classList.add('fantasma'); g.classList.remove('lv1', 'lv2');
    g.style.width = Math.min(drag.largura, window.innerWidth - 20) + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add('arrastando');
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
  const alvo = alvoDrop(e);
  $$('.marca-drop').forEach(x => x.remove());
  if (alvo && alvo.tipo === 'area') {
    const area = $('#area');
    const linhas = $$('#area .bloco');
    const mk = document.createElement('div'); mk.className = 'marca-drop';
    mk.style.marginLeft = `calc(${alvo.nivel} * var(--ind))`;
    if (alvo.pos < linhas.length) area.insertBefore(mk, linhas[alvo.pos]); else area.appendChild(mk);
  }
}
function alvoDrop(e) {
  const area = $('#area'), pool = $('#pool');
  if (!area) return null;
  const ra = area.getBoundingClientRect();
  if (e.clientX >= ra.left && e.clientX <= ra.right && e.clientY >= ra.top - 10 && e.clientY <= ra.bottom + 30) {
    const linhas = $$('#area .bloco').filter(x => x !== drag.el);
    let pos = linhas.length;
    for (let k = 0; k < linhas.length; k++) {
      const rr = linhas[k].getBoundingClientRect();
      if (e.clientY < rr.top + rr.height / 2) { pos = k; break; }
    }
    const ind = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ind')) || 30;
    const esq = e.clientX - drag.offX - ra.left - 10;
    const nivel = Math.max(0, Math.min(2, Math.round(esq / ind)));
    return { tipo: 'area', pos, nivel };
  }
  if (pool) {
    const rp = pool.getBoundingClientRect();
    if (e.clientX >= rp.left && e.clientX <= rp.right && e.clientY >= rp.top && e.clientY <= rp.bottom) return { tipo: 'pool' };
  }
  return null;
}
function soltarArrasto(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dr = drag;
  drag = null;
  if (!dr.ativo) return;
  ignorarCliqueAte = Date.now() + 300;
  dr.ghost.remove();
  $$('.marca-drop').forEach(x => x.remove());
  dr.el.classList.remove('arrastando');
  drag = dr;
  const alvo = alvoDrop(e);
  drag = null;
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d) return;
  const m = montagemDe(r, d);
  if (!alvo) return;
  if (alvo.tipo === 'area') {
    let nivel = m.ima && dr.bid[0] === 'c' ? nivelCorreto(d, dr.bid) : alvo.nivel;
    if (dr.onde === 'pool') { adicionarBloco(dr.bid, alvo.pos, nivel); return; }
    const [item] = m.area.splice(dr.i, 1);
    let pos = alvo.pos;
    item.l = nivel;
    m.area.splice(Math.min(pos, m.area.length), 0, item);
    Som.tocar('encaixe');
    mexeu();
  } else if (alvo.tipo === 'pool' && dr.onde === 'area') {
    const [item] = m.area.splice(dr.i, 1);
    m.pool.push(item.bid);
    Som.tocar('clique');
    mexeu();
  }
}

// ---------- executar ----------
function renderEventos(run) {
  let h = '';
  for (const ev of run.events) h += ev.t === 'in' ? `<span class="in">${escHtml(ev.s)}</span>` : escHtml(ev.s);
  if (run.error) {
    if (run.error.kind === 'timeout') h += `<span class="err">\n⏳ O programa passou de 50.000 passos e foi interrompido.\nUm laço que nunca termina? Veja se a variável do while muda dentro do laço.</span>`;
    else h += `<span class="err">${h && !h.endsWith('\n') ? '\n' : ''}${escHtml(run.error.trace)}</span>`;
  }
  return h;
}
function executar() {
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d) return;
  const m = montagemDe(r, d);
  const res = avaliar(d, m.area);
  const t0 = d.testes[0];
  if (res.status === 'incompleto') {
    resultadoPendente = { html: `<span class="info">O programa ainda está incompleto: a solução usa ${d.blocos.length} linhas e o seu tem ${m.area.length}.\nNenhum coração foi perdido.</span>` };
    Som.tocar('clique');
    renderDesafio();
    return;
  }
  const entradas = t0.in.length ? `<span class="tit">$ python dungeon.py   (teste 1 de 3 · entradas: ${escHtml(t0.in.join(', '))})</span>\n` : `<span class="tit">$ python dungeon.py   (teste 1 de 3)</span>\n`;
  const t1 = res.testes[0];
  let html = entradas + renderEventos(t1.run);
  if (res.status === 'ok') {
    html += `\n<span class="okk">✔ Teste 1 · ✔ Teste 2 (oculto) · ✔ Teste 3 (oculto)\nPROGRAMA APROVADO!</span>`;
    r.combo = (r.combo || 0) + 1;
    Som.tocar('acerto');
    resolverAtual(r, d, html);
    return;
  }
  // falhou
  const fi = res.testes.length - 1;
  const tf = res.testes[fi];
  if (res.pecaFalsa) {
    html += `\n<span class="err">✘ A saída bateu, mas tem peça falsa no lugar de uma verdadeira.</span>`;
  } else if (fi === 0 && tf.motivo === 'saida') {
    html += `\n<span class="err">✘ Teste 1: a saída ficou diferente da esperada.</span>\n<span class="tit">Saída esperada:</span>\n${renderEventos(tf.esperado)}`;
  } else if (fi > 0) {
    html += `\n<span class="okk">✔ Teste 1</span>\n<span class="err">✘ Teste ${fi + 1} (oculto): com outros valores, ${tf.motivo === 'erro' ? `o programa deu erro (${escHtml(tf.run.error.type)})` : 'a saída ficou errada'}.\nTem algum valor fixo no código, ou a conta só funciona por sorte?</span>`;
  } else {
    html += `\n<span class="err">✘ O programa deu erro. Leia a última linha vermelha: ela diz o que aconteceu.</span>`;
  }
  r.combo = 0;
  Som.tocar('erro');
  const morreu = perderCoracao(r);
  if (morreu) return;
  let botao = '';
  const outrosNormais = r.fila.filter(id => id !== d.id && DES[id].dif !== 'B').length;
  if (d.dif !== 'B' && outrosNormais > 0) {
    r.fila.shift();
    r.fila.splice(r.fila.length - 1, 0, d.id);
    html += `\n<span class="info">Esse desafio foi para o fim da fila. Você volta nele antes do BOSS.</span>`;
    botao = `<button class="btn pri cta" data-acao="proximo">Próximo desafio ▶</button>`;
    resultadoPendente = { html, botao, bloqueia: true, fixo: true };
    persistir();
    renderCongelado(d);
  } else {
    resultadoPendente = { html };
    persistir();

  }

}
function perderCoracao(r) {
  if (r.sandbox || god()) { toast('Modo professor: o coração não foi perdido.'); return false; }
  r.vidas--; r.perdidos++;
  Som.tocar('coracao');
  persistir();
  if (r.vidas <= 0) { morrer('Seus 3 corações acabaram.'); return true; }

}
function resolverAtual(r, d, html) {
  r.fila.shift();

  const acabou = r.fila.length === 0;
  const botao = acabou

  resultadoPendente = { html, botao, bloqueia: true, fixo: true, voltarPara: d.id };
  persistir();
  renderCongelado(d);
}
function renderCongelado(d) {

  const filaReal = r.fila.slice();

}
function proximo() {
  resultadoPendente = null;

  if (!r.fila.length) { concluirAndar(); return; }
  renderDesafio();
}

function morrer(motivo) {
  resultadoPendente = null;

  if (sandbox) { sandbox = null; }

  document.body.appendChild(el);

function concluirAndar() {
  resultadoPendente = null;
  const r = S.run;
  const n = r.andar;
  const A = ANDARES[n];
  const estrelas = Math.max(1, 3 - r.perdidos);
  let msg = '', moeda = false;
  if (god()) S.teste = true;
  if (r.modo === 'valendo') {
    S.andares[n] = { estrelas, data: Date.now(), tentativa: S.tentativas[n] || 1 };
    msg = `Primeira vez completando este andar: <b>valeu nota</b> com ${estrelas} estrela${estrelas > 1 ? 's' : ''}.`;
    if (n <= 5 && !S.bossPago[n]) { S.bossPago[n] = true; S.moedas++; S.moedasGanhas++; moeda = true; }
  } else if (r.modo === 'ampulheta') {
    const antes = S.andares[n].estrelas;
    S.andares[n].estrelas = Math.max(antes, estrelas);
    S.andares[n].ampulheta = true;
    msg = estrelas > antes ? `⏳ A Ampulheta funcionou: de ${antes} para <b>${estrelas}</b> estrelas.` : `⏳ Ficou a melhor marca: ${antes} estrela${antes > 1 ? 's' : ''}.`;
  } else {
    msg = `Treino concluído com ${estrelas} estrela${estrelas > 1 ? 's' : ''}. A nota deste andar continua a da primeira vez (${S.andares[n].estrelas}★).`;
  }
  S.run = null;
  persistir();
  setTema(A.tema);
  Som.tocar('vitoria' + n);
  if (moeda) setTimeout(() => Som.tocar('moeda'), 1800);
  view().innerHTML = `<div class="card banner-vitoria ${n === 2 ? 'tremer' : ''}" style="max-width:760px;margin:30px auto">
    <h1>${escHtml(A.vitoria)}</h1>

    <p>${msg}</p>
    ${moeda ? '<p style="font-size:1.2em">🪙 Você ganhou <b>1 Moeda de Ouro</b> por derrotar este BOSS pela primeira vez!</p>' : ''}
    ${n === 6 && totalEstrelas(S) === 18 ? '<p>🔓 Com 18 estrelas, a <b>Sala Secreta</b> abriu no mapa.</p>' : ''}
    <div class="row" style="justify-content:center"><button class="btn" data-acao="placar">🏆 Baixar placar</button><button class="btn pri cta" data-acao="ir-mapa">🗺 Voltar ao mapa</button></div></div>`;

function abrirD20() {
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d) return;
  const dado = r.dados[d.id];
  if (dado && dado.sucesso) { verDica(); return; }
  if (!dado) { rolarD20(false); return; }
  mostrarResultadoDado(false);
}
function rolarD20(pagandoVida) {
  const r = ctxRun(), d = desafioAtual();
  const cd = DIF_INFO[d.dif].cd;
  if (pagandoVida) {
    if (r.vidas <= 1 && !god() && !r.sandbox) return;
    if (perderCoracao(r)) return;
  }
  const nat = randInt(20) + 1;
  const bonus = r.bardo ? randInt(4) + 1 : 0;
  const total = nat + bonus;
  const dado = r.dados[d.id] || (r.dados[d.id] = { rolagens: [], sucesso: false, critico: false });
  dado.rolagens.push({ nat, bonus, total });
  dado.sucesso = total >= cd || nat === 20;
  if (nat === 20) {
    dado.critico = true;
    const m = montagemDe(r, d);
    const vivos = d.distratores.map((_, i) => 'd' + i).filter(b => !m.removidos.includes(b));
    if (vivos.length) {
      const alvo = vivos[randInt(vivos.length)];
      m.removidos.push(alvo);
      const ai = m.area.findIndex(b => b.bid === alvo);
      if (ai >= 0) m.area.splice(ai, 1);
      const pi = m.pool.indexOf(alvo);
      if (pi >= 0) m.pool.splice(pi, 1);
      dado.destruiu = blocoCodigo(d, alvo);
    }
  }
  persistir(); // grava ANTES da animação (F5 não muda o resultado)
  Som.tocar('dado');
  abrirModal(`<h2 style="text-align:center">🎲 Rolando o D20…</h2>${svgD20('?', 'rolando')}<p class="muted" style="text-align:center">CD ${cd}</p>`, { travado: true });

  const iv = setInterval(() => {
    const t = $('#modal-fundo text');
    if (t) t.textContent = randInt(20) + 1;
    if (++k > 9) { clearInterval(iv); mostrarResultadoDado(true); }
  }, 110);
}
function mostrarResultadoDado(acabouDeRolar) {
  const r = ctxRun(), d = desafioAtual();
  const cd = DIF_INFO[d.dif].cd;
  const dado = r.dados[d.id];
  const ult = dado.rolagens[dado.rolagens.length - 1];
  if (acabouDeRolar) Som.tocar(ult.nat === 20 ? 'critico' : (dado.sucesso ? 'acerto' : 'erro'));
  const podePagar = r.vidas > 1 || god() || r.sandbox;

  if (acabouDeRolar && ult.nat === 20) renderDesafio();

async function usarItem(id) {
  const r = ctxRun(), d = desafioAtual();
  const it = ITENS.find(x => x.id === id);
  if (!r || !d || !it || !(S.inv[id] > 0)) return;
  const m = montagemDe(r, d);
  const regras = {
    'ITEM-01': () => r.bardo ? 'O Dado de Bardo já está ativo neste andar.' : null,
    'ITEM-02': () => r.vidas >= 3 ? 'Seus corações já estão cheios.' : null,
    'ITEM-03': () => d.dif === 'B' ? 'O Pergaminho não funciona contra o BOSS.' : null,
    'ITEM-04': () => d.distratores.every((_, i) => m.removidos.includes('d' + i)) ? 'Não sobrou peça falsa neste desafio.' : null,
    'ITEM-05': () => m.ima ? 'O Ímã já está ativo neste desafio.' : null,
  };
  const bloqueio = regras[id] && regras[id]();
  if (bloqueio) { toast(bloqueio); return; }
  if (!(await confirmar(`Usar <b>${it.icone} ${escHtml(it.nome)}</b>?<br><span class="small muted">${escHtml(it.efeito)}</span>`, 'Usar'))) return;
  S.inv[id]--;
  switch (id) {
    case 'ITEM-01': r.bardo = true; break;
    case 'ITEM-02': r.vidas = Math.min(3, r.vidas + 1); Som.tocar('acerto'); break;
    case 'ITEM-03': {
      r.fila.shift(); r.resolvidos.push(d.id);
      persistir(); toast('⏭ Desafio pulado.');
      resultadoPendente = null;
      if (!r.fila.length) concluirAndar(); else renderDesafio();
      return;
    }
    case 'ITEM-04':
      d.distratores.forEach((_, i) => {
        const b = 'd' + i;
        if (!m.removidos.includes(b)) m.removidos.push(b);
        const ai = m.area.findIndex(x => x.bid === b); if (ai >= 0) m.area.splice(ai, 1);
        const pi = m.pool.indexOf(b); if (pi >= 0) m.pool.splice(pi, 1);
      });
      break;
    case 'ITEM-05':
      m.ima = true;
      m.area.forEach(b => { b.l = nivelCorreto(d, b.bid); });
      break;
  }
  Som.tocar('moeda');
  mexeu();
}

// ---------- foco / saída de tela ----------
let awayStart = null;
let pausaFocoAte = 0;
function vigiando() {
  if (!S || !S.run || sandbox || god()) return false;
  if (Date.now() < pausaFocoAte) return false;
  if (S.run.printp && Date.now() < S.run.printp.ate) return false;
  return true;
}
function saiu() {
  if (!vigiando() || awayStart !== null) return;
  awayStart = Date.now();
  S.run.away = awayStart;
  persistir();
}
function voltou() {
  if (awayStart === null) return;
  const dur = Date.now() - awayStart;
  awayStart = null;
  if (!S || !S.run) return;
  S.run.away = null;
  if (!vigiando()) { persistir(); return; }
  if (dur > 2000) { infracao(`Você ficou ${Math.round(dur / 1000)} s fora da tela.`); return; }
  const agora = Date.now();
  S.run.micro = (S.run.micro || []).filter(t => agora - t < 30000);
  S.run.micro.push(agora);
  if (S.run.micro.length >= 3) { S.run.micro = []; infracao('3 saídas rápidas em menos de 30 segundos.'); return; }
  persistir();
}
function verificarSaidaPendente() {
  if (S && S.run && S.run.away) {
    const passou = Date.now() - S.run.away;
    S.run.away = null;
    if (passou < 10 * 60000 && !god()) S.run.pendente = `A página foi fechada ou recarregada no meio do andar (${Math.round(passou / 1000)} s fora).`;
  }
}
const FRASES_ALIVIO = [
  'Ufa, era só um susto. Mas o colosso estava de olho em você.',
  'Lydia viu você saindo. Ela não vai contar pra ninguém… dessa vez.',
  'A polícia de Los Santos anotou a placa. Volta pro jogo.',
  'A fogueira quase apagou. Fica perto dela.',
  'A Marca coçou. A causalidade percebeu.',
];
function infracao(motivo) {
  const r = S.run;
  r.saidas++; S.saidasTotal++;
  persistir();
  if (r.saidas >= 5) { morrer('5ª saída de tela. ' + motivo); return; }
  Som.tocar('alarme');
  const ov = document.createElement('div');
  ov.className = 'foco-fundo susto';
  ov.innerHTML = `<div class="foco-caixa"><h1>⚠ SAÍDA DE TELA DETECTADA</h1><p style="font-size:1.2em">${escHtml(motivo)}</p></div>`;
  document.body.appendChild(ov);
  setTimeout(() => {

    ov.innerHTML = `<div class="foco-caixa">
      <h1>${ultimo ? '⚠ ÚLTIMO AVISO!' : `Aviso ${r.saidas} de 4`}</h1>
      <p style="font-size:1.15em">${ultimo ? 'Suas chances acabaram. Na próxima saída o progresso deste andar será ZERADO!' : escHtml(FRASES_ALIVIO[(r.saidas - 1) % FRASES_ALIVIO.length])}</p>

      <button class="btn pri grande" id="btn-voltei">OK, voltei</button></div>`;

function iniciarVigia() {
  window.addEventListener('blur', saiu);
  window.addEventListener('focus', voltou);
  window.addEventListener('pagehide', saiu);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saiu(); else voltou(); });
  setInterval(() => {
    const b = document.getElementById('badge-print');
    const r = S && S.run;
    if (r && r.printp && Date.now() < r.printp.ate) {
      const s = Math.ceil((r.printp.ate - Date.now()) / 1000);
      b.style.display = 'block';
      b.textContent = `📸 Pode tirar o print · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    } else b.style.display = 'none';
  }, 500);
}

// ---------- palavras-passe de teclado ----------
let bufTeclas = '', bufTempo = 0;
function teclaDigitada(e) {
  const alvo = e.target;
  if (alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.tagName === 'SELECT')) return;
  if (e.ctrlKey && e.altKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); abrirProf(); return; }
  if (!/^[a-zA-Z]$/.test(e.key)) return;
  const agora = Date.now();
  if (agora - bufTempo > 2500) bufTeclas = '';
  bufTempo = agora;
  bufTeclas = (bufTeclas + e.key.toUpperCase()).slice(-12);
  if (bufTeclas.endsWith('PRINTP')) { bufTeclas = ''; liberarPrint(); }
  else if (bufTeclas.endsWith('SINAL')) { bufTeclas = ''; sinal(); }
  else if (bufTeclas.endsWith('GODMODE')) { bufTeclas = ''; ativarGod(); }
}
async function liberarPrint() {
  if (!S || !S.run) { toast('Fora de um andar não precisa: pode tirar o print à vontade.'); return; }
  if (S.run.printp.usados >= 3) { toast('Limite de 3 liberações de print nesta tentativa.'); return; }
  if (!(await pedirSenha('Liberar 60 segundos sem penalidade de foco para tirar print.'))) return;
  S.run.printp.usados++;
  S.run.printp.ate = Date.now() + 60000;
  persistir();
  toast('📸 60 segundos liberados.');
}
async function sinal() {
  if (!S) return;
  if (!(await pedirSenha('Bateu o sinal: baixar o PNG de checkpoint deste jogador agora.'))) return;
  await baixarPlacar(true);
}
async function ativarGod() {
  if (!(await pedirSenha('Ativar o Modo Professor (vidas infinitas, foco livre, todos os andares).'))) return;
  store.sset('god', god() ? '0' : '1');
  toast(god() ? 'Modo Professor ATIVADO nesta aba.' : 'Modo Professor desativado.');
  if (S) mostrar(telaAtual === 'desafio' ? 'desafio' : 'mapa');
}

  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  for (let n = 1; n <= 6; n++) {
    const y = 560 + (n - 1) * 78;

  for (const l of linhas) { g.fillStyle = l.startsWith('[') ? '#ff5c6c' : '#ece6f5'; g.fillText(l, 90, y); y += 46; }
  const agora = Date.now();

const LINHAS_VELHA = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function vencedorVelha(t) {
  for (const [a, b, c] of LINHAS_VELHA) if (t[a] && t[a] === t[b] && t[a] === t[c]) return t[a];

function minimax(t, vez) {

  let melhor = { s: vez === '⭕' ? -2 : 2, i: -1 };
  for (let i = 0; i < 9; i++) {
    if (t[i]) continue;
    t[i] = vez;
    const r = minimax(t, vez === '⭕' ? '❌' : '⭕');
    t[i] = '';
    if ((vez === '⭕' && r.s > melhor.s) || (vez === '❌' && r.s < melhor.s)) melhor = { s: r.s, i };
  }

}

    const livres = velha.t.map((x, k) => x ? -1 : k).filter(k => k >= 0);
    const jogada = randInt(100) < 25 ? livres[randInt(livres.length)] : minimax(velha.t.slice(), '⭕').i;

  else if (w === '⭕') { velha.placar.d++; velha.fala = sorteia(FALAS_MESTRE.mestreGanha); Som.tocar('erro'); }
  else { velha.placar.e++; velha.fala = sorteia(FALAS_MESTRE.empate); }

}

async function suiteQA() {
  const out = [];
  const ok = (nome, cond, det = '') => out.push({ nome, ok: !!cond, det });
  const t0 = performance.now();
  for (const d of DESAFIOS) {
    const q = qaDesafio(d);
    ok(`${d.id} · ${d.titulo} (gabarito passa nos 3 testes, cada peça falsa reprova)`, q.ok, q.falhas.join('; '));
  }
  const py = (src, inp) => runPython(src, { inputs: inp || [] });
  ok('Python: f"{6.25:.1f}" dá 6.2 (igual ao CPython, não 6.3)', py("print(f'{6.25:.1f}')").stdout === '6.2\n');
  ok('Python: print(8.0) mostra 8.0', py('print(8.0)').stdout === '8.0\n');
  ok('Python: 0.1 + 0.2 mostra 0.30000000000000004', py('print(0.1 + 0.2)').stdout === '0.30000000000000004\n');
  ok('Python: round(2.5) dá 2 (arredondamento bancário)', py('print(round(2.5), round(3.5))').stdout === '2 4\n');
  ok('Python: math.ceil((5.5+5.5+7.3)/3*10)/10 dá 6.2 (o erro que o A6-BOSS corrige)', py('import math\nprint(math.ceil((5.5+5.5+7.3)/3*10)/10)').stdout === '6.2\n');
  ok('Python: com round(..., 2) antes do ceil dá 6.1', py('import math\nprint(math.ceil(round((5.5+5.5+7.3)/3*10, 2))/10)').stdout === '6.1\n');
  ok('Python: IndentationError depois de if', (py('x = 1\nif x:\nprint(x)\n').error || {}).msg === "expected an indented block after 'if' statement on line 2");
  ok('Python: NameError sugere print', (py("Print('a')").error || {}).msg === "name 'Print' is not defined. Did you mean: 'print'?");
  ok('Python: loop infinito é interrompido', (runPython('x = 1\nwhile x > 0:\n    x = x + 1\n', { maxSteps: 5000 }).error || {}).kind === 'timeout');
  ok('SHA-256("abc")', sha256Hex('abc') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
  ok('CRC-32("123456789") = cbf43926', crc32(new TextEncoder().encode('123456789')).toString(16) === 'cbf43926');
  const fake = novoSave({ nome: 'Maria da Silva', numero: '12', turma: CFG.turmas[0] });
  fake.andares = { 1: { estrelas: 3 }, 2: { estrelas: 2 }, 3: { estrelas: 1 } }; fake.saidasTotal = 4; fake.moedasGanhas = 3;
  const cod = codigoConferencia(fake);
  const v = validarCodigo(cod, fake.id);
  ok(`Código de conferência gera e valida (${cod})`, v.ok && v.dados.nota10 === 33 && v.dados.estrelas.join('') === '321000' && v.dados.saidas === 4);
  ok('Código aceita O no lugar de 0 e minúsculas', validarCodigo(cod.replace(/0/g, 'O').toLowerCase(), fake.id).ok);
  ok('Código de outro aluno é recusado', !validarCodigo(cod, { nome: 'João Souza', numero: '12', turma: CFG.turmas[0] }).ok);
  const sig = assinar(fake);
  const fake2 = JSON.parse(JSON.stringify(fake)); fake2.moedas = 99;
  ok('Assinatura do save detecta moedas editadas', assinar(fake2) !== sig && assinar(JSON.parse(JSON.stringify(fake))) === sig);
  try {
    const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8;
    const bytes = await canvasParaBytes(cv);
    const pack = pacotePNG(fake, false);
    const com = pngInserirTexto(bytes, PNG_KEY, pack);
    const lido = pngLerTexto(com, PNG_KEY);
    const pk = lerPacotePNG(lido.texto || '');
    ok('PNG: grava e lê o bloco tEXt com CRC-32', lido.texto === pack && pk.valido && pk.save.id.nome === 'Maria da Silva');
    ok('PNG sem dados (imagem comum) é recusado', !!pngLerTexto(bytes, PNG_KEY).erro);
  } catch (e) { ok('PNG: grava e lê o bloco tEXt', false, e.message); }
  return { out, ms: Math.round(performance.now() - t0) };
}

function parseTabela(txt) {
  const linhas = txt.split(/\r?\n/).filter(l => l.trim());
  if (!linhas.length) return [];
  const sep = linhas[0].includes('\t') ? '\t' : (linhas[0].split(';').length > linhas[0].split(',').length ? ';' : ',');
  const split = (l) => {
    if (sep === '\t') return l.split('\t');
    const out = []; let cur = '', q = false;
    for (const ch of l) {
      if (ch === '"') q = !q;
      else if (ch === sep && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  };
  const cab = split(linhas[0]).map(normTxt);
  const idx = (pred) => cab.findIndex(pred);
  const iNome = idx(h => h.includes('nome'));
  const iNum = idx(h => h.startsWith('n') && (h.includes('numero') || h === 'n' || h === 'no' || h.includes('chamada') || h === 'num'));
  const iTurma = idx(h => h.includes('turma'));
  const iCod = idx(h => h.includes('codigo') || h.includes('conferencia'));
  if ([iNome, iNum, iTurma, iCod].some(i => i < 0)) return { erro: 'Não achei as colunas. O cabeçalho precisa ter: Nome, Número, Turma e Código.' };
  return linhas.slice(1).map(l => { const c = split(l); return { nome: (c[iNome] || '').trim(), numero: (c[iNum] || '').trim(), turma: (c[iTurma] || '').trim(), codigo: (c[iCod] || '').trim() }; });
}

}
function linhaAuditoria(id, status, dados, origem, arquivo) {
  return { nome: id.nome, numero: id.numero, turma: id.turma, codigo: id.codigo, status, origem, arquivo,

function marcarDuplicados() {
  // um código que não confere com quem enviou é testado contra os outros nomes da lista
  auditoriaLinhas.forEach(l => {
    if (!l.codigo || !String(l.status).startsWith('NÃO CONFERE')) return;
    const dono = auditoriaLinhas.find(o => o !== l && o.nome && validarCodigo(l.codigo, o).ok);
    if (dono) l.status = `CÓDIGO DE OUTRO ALUNO (confere com ${dono.nome}, nº ${dono.numero})`;
  });
}
function mostrarAuditoria() {

function exportarCSV() {
  if (!auditoriaLinhas.length) { toast('Valide alguma coisa primeiro.'); return; }
