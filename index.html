        <select id="mu-exibir" aria-label="Como mostrar o nome">
          <option value="primeiro" ${muralFiltro.exibir === 'primeiro' ? 'selected' : ''}>Primeiro nome + inicial</option>
          <option value="completo" ${muralFiltro.exibir === 'completo' ? 'selected' : ''}>Nome completo</option>
          <option value="numero" ${muralFiltro.exibir === 'numero' ? 'selected' : ''}>Só o número</option></select>
        <div class="spacer"></div>
        <button class="btn pri" id="mu-tela">⛶ Tela cheia para projetar</button>
      </div>
      <details style="margin-top:10px"><summary>Atualizar sozinho com o Google Forms (opcional)</summary>
        <ol class="small">
          <li>No formulário, as perguntas precisam se chamar <b>Nome</b>, <b>Número</b>, <b>Colégio</b>, <b>Turma</b> e <b>Código</b>.</li>
          <li>Na planilha de respostas: <b>Arquivo → Compartilhar → Publicar na Web</b>, escolha a aba de respostas e o formato <b>Valores separados por vírgula (.csv)</b>.</li>
          <li>Cole o link aqui. O mural relê a planilha a cada 30 segundos enquanto esta tela estiver aberta.</li>
        </ol>
        <div class="row"><input id="mu-url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" value="${escHtml(url)}" style="flex:1;min-width:240px;padding:9px;border-radius:6px;border:2px solid var(--line);background:var(--code-bg);color:var(--txt)">
        <button class="btn" id="mu-ler">Ler agora</button></div>
        <p class="small muted">Atenção: com a planilha publicada, quem tiver o link vê nomes e códigos. Não divulgue o link para os alunos.</p>
      </details>
      <p class="small" id="mu-status" role="status">${escHtml(muralStatus || (auditoriaLinhas.length ? 'Usando os dados da aba Auditoria.' : 'Sem dados ainda: valide PNGs ou cole a planilha na aba Auditoria, ou ligue a planilha publicada acima.'))}</p>
    </div>
    <div id="mural"></div>`;
  const sel = (id, k) => $(id).onchange = (e) => { muralFiltro[k] = e.target.value; desenharMural(); };
  sel('#mu-escola', 'escola'); sel('#mu-turma', 'turma'); sel('#mu-exibir', 'exibir');
  $('#mu-ler').onclick = async () => {
    const u = $('#mu-url').value.trim();
    store.set('muralCsv', u);
    if (!u) { muralLinhas = []; pararMural(); desenharMural(); return; }
    $('#mu-status').textContent = 'Lendo…';
    await lerPlanilhaPublicada(u); $('#mu-status').textContent = muralStatus; desenharMural(); ligarMural(u);
  };
  $('#mu-tela').onclick = () => { const m = $('#mural'); try { (m.requestFullscreen || m.webkitRequestFullscreen).call(m); } catch (e) { toast('Tela cheia não suportada aqui.'); } };
  desenharMural();
  if (url) { lerPlanilhaPublicada(url).then(() => { const st = $('#mu-status'); if (st) st.textContent = muralStatus; desenharMural(); }); ligarMural(url); }
}
function ligarMural(url) {
  pararMural();
  muralTimer = setInterval(async () => {
    if (!$('#mural')) { pararMural(); return; }
    await lerPlanilhaPublicada(url);
    const st = $('#mu-status'); if (st) st.textContent = muralStatus;
    desenharMural();
  }, 30000);
}
function pararMural() { if (muralTimer) clearInterval(muralTimer); muralTimer = null; }
function desenharMural() {
  const el = $('#mural');
  if (!el) return;
  const lista = juntarMural().filter(l => (!muralFiltro.escola || l.escola === muralFiltro.escola) && (!muralFiltro.turma || l.turma === muralFiltro.turma))
    .map(l => ({ ...l, faixa: faixaDe({ estrelas: l.estrelas }), total: l.estrelas.reduce((a, b) => a + b, 0) }));
  const titulo = [muralFiltro.escola, muralFiltro.turma].filter(Boolean).join(' · ') || 'Todas as turmas';
  el.innerHTML = `<div class="mural">
    <div class="mural-topo"><h2>${ico('andar7')} A Montanha da Dungeon</h2><span>${escHtml(titulo)} · ${lista.length} aventureiro${lista.length === 1 ? '' : 's'}</span></div>
    ${MURAL_FAIXAS.map((f, i) => {
      const aqui = lista.filter(l => l.faixa === f.id).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
      const largura = 46 + i * 7.7;
      return `<section class="faixa ${f.tema}" style="--larg:${largura}%">
        <header>${ico(f.ico)} <b>${escHtml(f.nome)}</b> <small>${escHtml(f.sub)} · ${aqui.length}</small></header>
        <div class="fichas">${aqui.map(l => `<span class="ficha" title="${escHtml(l.nome)} · ${escHtml(l.turma)}">${escHtml(nomeMural(l.nome, l.numero))} <i>★${l.total}</i></span>`).join('') || '<span class="vazia">ninguém aqui ainda</span>'}</div>
      </section>`;
    }).join('')}
  </div>`;
}

// ===================== INICIALIZAÇÃO =====================
function iniciar() {
  document.addEventListener('click', (e) => { Som.destravar(); cliqueGlobal(e); });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.cod[data-acao]')) { e.preventDefault(); adicionarBloco(e.target.dataset.bid); return; }
    teclaDigitada(e);
  });
  document.addEventListener('pointerdown', iniciarArrasto);
  document.addEventListener('pointermove', moverArrasto, { passive: false });
  document.addEventListener('pointerup', soltarArrasto);
  document.addEventListener('pointercancel', (e) => {
    if (drag && drag.ghost) { drag.ghost.remove(); drag.el.classList.remove('arrastando'); $$('.marca-drop').forEach(x => x.remove()); }
    drag = null;
  });
  const bloqueia = (e) => { if (telaAtual === 'desafio' && !sandbox) e.preventDefault(); };
  document.addEventListener('contextmenu', bloqueia);
  document.addEventListener('copy', bloqueia);
  document.addEventListener('cut', bloqueia);
  document.addEventListener('dragstart', (e) => { if (e.target.closest && e.target.closest('.bloco')) e.preventDefault(); });
  window.addEventListener('error', (ev) => { try { toast('Erro interno: ' + ev.message, 6000); } catch (e) { } });
  iniciarVigia();
  mostrar('inicio');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();

})();
</script>
